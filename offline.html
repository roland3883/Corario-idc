<head>
<meta charset="UTF-8" />

<title>Corario IdC</title>
<style>

:root {

    /* Fondo principal */
    --bg: #F4F6F8;

    /* Tarjetas */
    --card: #FFFFFF;

    /* Texto principal */
    --ink: #1B2A41;

    /* Texto secundario */
    --muted: #6C7A89;

    /* Azul marino */
    --accent: #1F3C88;

    /* Azul marino oscuro */
    --accent-dark: #142850;

    /* Bordes plateados */
    --border: #C7D0D9;

    /* Fondo resaltado */
    --highlight: #E9EEF3;
}
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff8f0;
    padding: 20px 16px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  header h1 {
    margin: 0 0 4px 0;
    font-size: 1.5rem;
    letter-spacing: 0.5px;
  }
  header p {
    margin: 0;
    font-size: 0.85rem;
    opacity: 0.85;
    font-family: Arial, sans-serif;
  }
  .search-wrap {
    max-width: 720px;
    margin: 16px auto 0 auto;
    padding: 0 16px;
  }
  #search {
    width: 100%;
    padding: 12px 16px;
    font-size: 1rem;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    font-family: Arial, sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  #search:focus {
    border-color: var(--accent);
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
  }
  #count {
    font-family: Arial, sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
    margin: 10px 2px;
  }
  #index-list {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  #index-list li {
    border-bottom: 1px solid var(--border);
  }
  #index-list li:last-child {
    border-bottom: none;
  }
  #index-list button {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 13px 16px;
    font-size: 1rem;
    font-family: Georgia, serif;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    gap: 10px;
    align-items: baseline;
    transition: background 0.15s;
  }
  #index-list button:hover, #index-list button:focus {
    background: var(--highlight);
  }
  #index-list .num {
    color: var(--accent-dark);
    font-weight: bold;
    font-family: Arial, sans-serif;
    min-width: 32px;
    flex-shrink: 0;
  }
  #index-list mark {
    background: #ffe08a;
    color: inherit;
    border-radius: 3px;
  }
  #no-results {
    display: none;
    text-align: center;
    color: var(--muted);
    padding: 30px 10px;
    font-family: Arial, sans-serif;
  }

  /* Song view */
  #song-view {
    display: none;
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 24px 22px;
  }
  #back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-family: Arial, sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    margin-bottom: 18px;
  }
  #back-btn:hover { background: var(--accent-dark); }
  #song-title {
    font-size: 1.4rem;
    color: var(--accent-dark);
    margin: 0 0 4px 0;
  }
  #song-num {
    font-family: Arial, sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0 0 16px 0;
  }
  #song-lyrics {
    font-size: 1.08rem;
    line-height: 1.75;
  }
  #song-lyrics strong { color: var(--accent-dark); }
  .nav-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
    gap: 10px;
  }
  .nav-buttons button {
    flex: 1;
    background: var(--highlight);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 10px;
    border-radius: 8px;
    font-family: Arial, sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .nav-buttons button:hover { background: var(--border); }
  .nav-buttons button:disabled { opacity: 0.4; cursor: default; }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  /* Barra superior dentro del marco del canto */
  .song-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }
  .song-toolbar #back-btn {
    margin-bottom: 0;
  }
  .font-controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    font-family: Arial, sans-serif;
    flex-shrink: 0;
  }
  .font-controls button.font-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--accent-dark);
    width: 28px;
    height: 28px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .font-controls button.font-btn:hover {
    background: var(--highlight);
  }
  .font-controls .font-label {
    color: var(--muted);
    font-size: 0.75rem;
    min-width: 34px;
    text-align: center;
  }

  /* Enlace "Acerca de" en el footer */
  .about-link {
    color: var(--muted);
    font-size: 0.65rem;
    /*text-decoration: underline;*/
    cursor: pointer;
    background: none;
    border: none;
    font-family: Arial, sans-serif;
    padding: 1px 2px;
  }
  .about-link:hover {
    color: var(--accent-dark);
  }

  /* Acerca de - floating modal */
  #about-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(43,36,32,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #about-overlay.open {
    display: flex !important;
    opacity: 1;
    pointer-events: auto;
  }
  #about-box {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 22px 26px;
    max-width: 280px;
    width: 85%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    font-family: Arial, sans-serif;
    position: relative;
  }
  #about-box h2 {
    margin: 0 0 6px 0;
    font-family: Georgia, serif;
    color: var(--accent-dark);
    font-size: 1.3rem;
  }
  #about-box p {
    margin: 4px 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  #about-close {
    position: absolute;
    top: 8px;
    right: 10px;
    background: none;
    border: none;
    font-size: 1.8rem;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
  }
  #about-close:hover {
    color: var(--ink);
  }
</style>
</head>

<script>
  // Arreglo de cantos
const SONGS = [{"num": 1, "title": "Grande es el Señor", "html": "Grande es el Se&ntilde;or creador del universo,<br />\ncanta  con gozo al Rey que viene pronto.<br />\nDe felicidad  el coraz&oacute;n nos llena.<br />\nGrande es el Se&ntilde;or. //<br />\nOH, OH, OH Hosanna al Alt&iacute;simo///<br />\nGrande es el Se&ntilde;or.<br />\n</p>"},
{"num": 2, "title": "Gracias Dios", "html": "Gracias Dios por tu bondad,<br />\nte alabo por tu  majestad.<br />\nGracias por tu inmenso amor<br />\nque  envi&oacute; al Salvador.<br />\n<br />\nCoro:<br />\nGracias Dios por tu bondad<br />\nGracias por tu gran fidelidad.<br /><br>\nAlabemos a una voz<br />\nel Nombre del potente  Dios, <br />\nelevemos en su honor<br />\nun canto de loor.  <br />\n<br />\nMu&eacute;strame tu santo ser,<br />\ninfunde en mi tu gran  poder.<br />\nQuiero de tu amor hablar<br />\ny por tu senda  andar.</p>\n<p id=\"c003\"><br />"},
{"num": 3, "title": "Bueno es alabar al Señor", "html": "Bueno es alabar al Se&ntilde;or,\n  su Nombre.<br />\n  Darle  gloria, honra y honor por siempre.<br />\n  Bueno es  alabar a Jes&uacute;s y gozarme en su poder. //<br />\n  <br />\n  Porque grande eres tu, grandes son tus obras<br />\n  porque grande eres tu grande es tu amor,<br />\n  grande es tu gloria //</p>"},
{"num": 4, "title": "Santuario", "html": "</p>\n<p>Se&ntilde;or prep&aacute;rame para ser un santuario,<br />\npuro y  santo, aprobado.<br />\nDando gracias, ser&eacute; un  santuario, un santuario para ti. /</p>"}, {"num": 5, "title": "Dios, tu pueblo canta", "html": "Dios, tu pueblo canta //<br />\nUna misma alabanza //<br />\nCantan para ti //<br />\nAl &uacute;nico y verdadero Dios.//<br />\n<br />\nCoro<br />\nAle, ale, alelu //<br />\nEn la gloria moras tu //<br />\nTu eres &uacute;nico //<br />\nEl &uacute;nico y verdadero Dios. //<br />\n<br />\nTe amamos Cristo //<br />\nPorque nos salvaste //<br />\nNo hay nadie como tu //<br />\nEl &uacute;nico y verdadero  Dios. // </p>"}, {"num": 6, "title": "Tu eres escudo alrededor de mi", "html": "T&uacute; eres escudo alrededor de m&iacute;, <br />\nt&uacute; eres  escudo alrededor de m&iacute;.<br />\nEres mi gloria, el que  levanta mi cabeza. //\n<br />\nNo temer&eacute; a diez millares de pueblos<br />\nque  hagan sitio contra m&iacute;. // (porque tu eres)</p>"}, {"num": 7, "title": "Al que es digno", "html": "Al que es digno de recibir la gloria<br />\nAl que es digno de recibir honor //<br />\n<br />\nLevantemos nuestras voces y adoremos<br />\na  Jes&uacute;s cordero de gloria y exaltemos<br />\nsu  incomparable majestad.<br />\nAl que vive por siempre, al gran Yo Soy. ///<br />\nA Jes&uacute;s.</p>"}, {"num": 8, "title": "Eres tu la única razón", "html": "Eres t&uacute; la &uacute;nica raz&oacute;n de mi adoraci&oacute;n OH  Jes&uacute;s.<br />\nEres t&uacute; la esperanza que anhele tener  OH Jes&uacute;s.<br />\nConfi&eacute; en ti me has ayudado,<br />\ntu salvaci&oacute;n me  has regalado.<br />\n<br />\nHoy hay gozo en mi coraz&oacute;n, \ncon  mi canto te alabar&eacute;.<br />\nTe alabare, te glorificare.  Te alabare mi buen Jes&uacute;s.//</p>"}, {"num": 9, "title": "La única razón de mi adoración", "html": "La &uacute;nica raz&oacute;n de mi adoraci&oacute;n eres tu mi  Jes&uacute;s.<br />\nEl &uacute;nico motivo para vivir eres tu mi  Se&ntilde;or.<br />\nMi &uacute;nica verdad est&aacute; en ti eres mi luz y mi  salvaci&oacute;n.<br />\nMi &uacute;nico amor eres tu Se&ntilde;or y por  siempre te alabar&eacute;.<br />\nTu eres todopoderoso  Eres grande y majestuoso<br />\nEres fuerte, invencible  Y no hay nadie como tu. //</p>"}, {"num": 10, "title": "Te amo en el amor del Señor", "html": "Te amo en el amor del Se&ntilde;or //<br />\nVeo en ti la gloria de Dios y<br />\nte amo en el amor  del Se&ntilde;or.</p>"}, {"num": 11, "title": "Tu fidelidad", "html": "</p>\n<p>Tu fidelidad es grande <br />\n  Tu  fidelidad incomparable es<br />\n  Nadie es como tu, Bendito Dios<br />\n  Grande es tu  fidelidad. <br />\n  &nbsp;<br />\n  Tu amor por mi es grande <br />\n  Tu  amor por mi incomparable es<br />\n  Nadie es como tu Bendito Dios<br />\n  Grande es tu amor por  m&iacute;. <br />\n  &nbsp;</p>"}, {"num": 12, "title": "Cantad a Jehová (Salmos 96: 1-2)", "html": "</p>\n<p>Cantad a Jehov&aacute; c&aacute;ntico  nuevo <br />\n  Cantad a Jehov&aacute; toda la  tierra<br />  \n  &nbsp;<br />\n  Cantad  a Jehov&aacute; bendecid Su Nombre<br />\n  Anunciad de d&iacute;a en d&iacute;a su salvaci&oacute;n. // <br />\n  &nbsp;</p>"}, {"num": 13, "title": "Soberano Dios", "html": "</p>\n<p>Soberano Dios, Dios  omnipotente Rey de reyes. <br />\n  A  ti sea el honor, el imperio y la alabanza.<br />\n  Desde ahora y para siempre, por los  siglos de los siglos<br />\n  exaltado seas tu coronado seas tu. <br />\n  Se&ntilde;or Jes&uacute;s, Se&ntilde;or Jes&uacute;s,  Se&ntilde;or Jes&uacute;s. <br />\n  Amen. // <br />\n  &nbsp;</p>"}, {"num": 14, "title": "Soy nueva criatura", "html": "</p>\n<p>Soy nueva criatura lo  declara la escritura <br />\n  El  me ha perdonado con su sangre me ha lavado<br />\n  Todos mis pecados con su sangre son  borrados<br /> \n  libre soy del pecado. // <br />\n  &nbsp;<br />\n  Libre, del pecado y la  maldad <br />\n  Soy libre, El ha roto mis  cadenas <br />\n  Libre,  libre para dar mi vida al que me salvo,<br />\n  al que me salvo. // <br />\n  Soy nueva criatura lo  declara la escritura. <br />\n  &nbsp;</p>"}, {"num": 15, "title": "Te alabare oh Señor", "html": "</p>\n<p>Te  alabare oh Se&ntilde;or, invocare tu santo\n  Nombre.<br />\nSiempre dar&eacute; a conocer en los  pueblos tus obras. //&nbsp;</p>\nGrandes son, grandes son, grandes son tus maravillas. //&nbsp;"}, {"num": 16, "title": "Renuévame", "html": "</p>\n<p>Renu&eacute;vame  Se&ntilde;or Jes&uacute;s, ya no quiero ser igual <br />\n  Renu&eacute;vame  Se&ntilde;or Jes&uacute;s, pon en mi tu coraz&oacute;n <br />\n  &nbsp;<br />\n  Porque todo lo que hay dentro de mi,<br />\n  necesita ser cambiado Se&ntilde;or.<br />\n  Porque todo lo que hay dentro de mi coraz&oacute;n,<br />\n  necesita mas de ti <br />\n  &nbsp;</p>"}, {"num": 17, "title": "Tu poder", "html": "</p>\n<p>T&uacute; poder anhelamos en este lugar y<br />\n  tu  victoria que nos da libertad.<br />\n  Tu poder anhelamos en este lugar y<br />\n  tu victoria  que nos dar&aacute; libertad// <br />\n  &nbsp;<br />\n  Libertad que t&uacute; ganaste,<br />\n  con tu sangre  redentora.<br />\n  Libertad que nos permite<br />\n  adorarte en esp&iacute;ritu y verdad //<br />\n  y en  verdad y en verdad, LIBERTAD! <br />\n  <strong>&nbsp;</strong></p>"}, {"num": 18, "title": "La cosecha", "html": "</p>\n<p>Alza tus ojos y mira, la cosecha esta  lista.<br />\n  El tiempo ha llegado, la mies esta madura. <br />\n  Esfu&eacute;rzate y se valiente, lev&aacute;ntate y  predica<br />\n  a todas las naciones que Cristo es la vida. <br />\n  &nbsp;<br />\n  Y  ser&aacute; llena la tierra de su gloria <br />\n  Se  cubrir&aacute; como las aguas cubren la mar. // <br />\n  &nbsp;<br />\n  No, no hay otro Nombre dado a los  hombres.<br />\n  Jesucristo es el Se&ntilde;or. <br />\n  &nbsp;<br />"}, {"num": 19, "title": "Somos el pueblo de Dios", "html": "Somos es pueblo de Dios, somos un pueblo  especial<br />\n  llamados para anunciar las virtudes de Aquel que nos llamo a Su luz. <br />\n  Somos el pueblo de Dios, Su sangre nos  redimi&oacute; y<br />\n  Su Esp&iacute;ritu dio para darnos poder y ser testigos de El. <br />\n  Y  llevaremos Su gloria a cada pueblo y naci&oacute;n<br />\n  tray&eacute;ndoles esperanzas y nuevas de  salvaci&oacute;n.<br />\n  Y Su amor nos impulsa, no nos podemos callar<br />\n  anunciaremos al mundo  de Su Amor y verdad // <br />\n  &nbsp;<br />"}, {"num": 20, "title": "Jehová esta en su templo.", "html": "Jehov&aacute;  esta en su templo al&aacute;bale que el vive <br />\nJehov&aacute;  esta en su templo al&aacute;bale que el vive. </p>\n<p>Al&aacute;bale, al&aacute;bale, al&aacute;bale que El vive. //&nbsp;</p>\n<p><br />"}, {"num": 21, "title": "Quiero cantar una linda canción", "html": "Quiero  cantar una linda canci&oacute;n de un hombre que me transform&oacute;.<br />\n  Quiero cantar una  linda canci&oacute;n de aquel que mi vida cambio. <br />\n  Es mi amigo Jes&uacute;s, es mi  amigo m&aacute;s fiel.&nbsp; <br />\n  El es Dios, El es Rey, es  amor y verdad.&nbsp; <br />\n  Solo  en El encontr&eacute; esa paz que busqu&eacute;,<br />\n  solo en El encontr&eacute; la felicidad. <br />\n&nbsp;<br />\nQuiero  que sepas amigo oyente que Cristo te tiene amor.<br />\nEl puede darle sentido a tu  vida entr&eacute;gate hoy al Se&ntilde;or.<br />\nCristo  tiene poder, nada hay que temer<br />\nEl es Dios, El es Rey, es amor y verdad. <br />\nSolo  en El hallaras el perd&oacute;n y la paz,<br />\nsolo en El hallaras la felicidad.&nbsp;&nbsp;&nbsp; <br />\n&nbsp;</p>"}, {"num": 22, "title": "Al cielo puedes llegar", "html": "</p>\n<p>Si  tu anhelas hoy al cielo llegar y deseas tener salvaci&oacute;n,<br />\n  acude pues al gran  Salvador y al cielo puedes llegar.<br />\n  <br />\n  <u>Coro:<br />\n  </u>Arrepi&eacute;ntete, obed&eacute;cele y salva tu alma hoy.<br />\n\tTu cree en El para salvaci&oacute;n y al cielo puedes llegar. <br />\n  &nbsp;<br />\n  Si  la Biblia dice ven a Jes&uacute;s por que te detienes hoy.<br />\n  Cristo te llama oh ven a la  lid y al cielo puedes llegar. <br />\n&nbsp;</p>"}, {"num": 23, "title": "Mi pensamiento eres tu", "html": "</p>\n<p>Mi pensamiento eres tu  Se&ntilde;or. //// <br />\n  Porque tu me has dado la  vida <br />\n  Porque  tu me has dado el existir<br />\n  Porque tu me has dado cari&ntilde;o<br />\n  Me has dado amor. <br />\n  &nbsp;</p>"}, {"num": 24, "title": "Dios está aquí", "html": "</p>\n<p>Dios est&aacute; aqu&iacute;, (aleluya) <br />\n  Tan cierto como el aire  que respiro <br />\n  Tan  cierto como en la ma&ntilde;ana<br />\n  se levanta el sol.<br />\n  Tan cierto como que le canto<br />\n  y me  puede o&iacute;r. <br />\n  &nbsp;<br />\n  Cristo est&aacute; aqu&iacute;&hellip; <br />\n  <br />\n  Su Esp&iacute;ritu est&aacute; aqu&iacute;&hellip;&nbsp;<br />\n</p>"}, {"num": 25, "title": "La Roca", "html": "</p>\n<p>Es  la Roca de m&iacute; de m&iacute; ser.<br />\n  Es El que da paz a mi coraz&oacute;n,<br />\n  es El sol que ilumina  mi vida si lo es.<br />\n  Su dulce Nombre es Jes&uacute;s<br />\n  por siempre lo cantare, lo esperare<br />\n  porque El es mi Salvador. <br />\n  &nbsp;<br />\n  En mi coraz&oacute;n  tengo a Cristo,<br />\n  de la  mano voy con El hacia el cielo.<br />\n  Yo cantare que tengo un amigo<br />\n  cuyo Nombre es  Jesucristo,<br />\n  hoy le doy mi coraz&oacute;n.<br />\n  <br />\n  Oh es la Roca de m&iacute; ser&hellip;&nbsp; <br />\n&nbsp;</p>"}, {"num": 26, "title": "Todavía Señor", "html": "</p>\n<p>Todav&iacute;a Se&ntilde;or hay un gran conflicto en  mi,<br />\n  entre lados opuestos de mi ser.<br />\n  Hay un yo ego&iacute;sta que no se rinde a ti<br />\n  y  otro yo que te quiere obedecer. <br />\n  &nbsp;<br />\n  Todav&iacute;a Se&ntilde;or no soy lo que debo ser<br />\nTu  mereces de mi vida lo mejor.<br />\nPero gracias a ti que con tu poder y amor<br />\nya no  soy lo que era Se&ntilde;or. <br />\n&nbsp;</p>"}, {"num": 27, "title": "Los que confían en Jehová (Salmos 125)", "html": "Los  que conf&iacute;an en Jehov&aacute; son como el monte de Sion<br />\nque no se mueve sino que  permanece para siempre. </p>\n<p>Como Jerusal&eacute;n tiene montes alrededor de  ella<br />\n  as&iacute; Jehov&aacute; esta alrededor de su pueblo,<br />\n  as&iacute; Jehov&aacute; esta alrededor de su  pueblo. <br />\n&nbsp;</p>"}, {"num": 28, "title": "Acuérdate de tu creador", "html": "</p>\n<p>Acu&eacute;rdate de tu creador en los d&iacute;as de tu  juventud.<br />\n  Antes que vengan los d&iacute;as malos y los a&ntilde;os que te har&aacute;n lamentar.<br />\n  Teme a Dios y guarda sus mandatos, esto  es el todo del hombre<br />\n  porque Dios traer&aacute; toda obra a juicio tanto el bien como  el mal.&nbsp; <br />\n&nbsp;</p>"}, {"num": 29, "title": "El alfarero", "html": "</p>\n<p>T&uacute; eres el alfarero que con tus manos me  has transformado. //<br />\n  Y mientras pasan los d&iacute;as, pasan los a&ntilde;os yo te  venero.<br />\nRompe mi c&aacute;ntaro, rompe mi copa, rompe mi  vida y hazla de nuevo. // </p>\n<p>&nbsp;</p>"}, {"num": 30, "title": "A Jehová invocaré (a dos voces)", "html": "A Jehov&aacute; invocar&eacute;, &eacute;l es digno de loor,<br />\npues me salvara de los malos.<br />\n<br />\n<u>Coro:<br />\n</u>Mi Dios vive, bendita sea  mi roca<br />  \nQue el Dios que salva sea engrandecido. // <br />\n&nbsp; <br />\n&iquest;Quien es Dios sino Jehov&aacute;? Fuera de &Eacute;l,<br />\n&iquest;que roca hay? Dios es quien me ci&ntilde;e de fuerzas. <br />\n&nbsp; <br />\nA su Nombre cantare, porque El<br />\nme ha  salvado a m&iacute;. Le confesare en las naciones. <br />\n&nbsp; </p>"}, {"num": 31, "title": "Puedo confiar en el Señor", "html": "</p>\n<p>Puedo confiar en el Se&ntilde;or, no me va a  fallar. //<br />\n  Si el sol llegare a oscurecer y no brillare nunca m&aacute;s,<br />\n  yo igual  conf&iacute;o en el Se&ntilde;or. No me va a fallar. <br />\n  Puedo descansar, puedo descansar,<br />\n  que a  su mansi&oacute;n Cristo me guiar&aacute;.<br />\n  Si el sol llegare a oscurecer&hellip; <br />\n&nbsp; </p>"}, {"num": 32, "title": "Alguien esta aquí", "html": "</p>\n<p>Alguien esta aqu&iacute; y yo se que es Cristo <br />\n  Alguien esta aqu&iacute; y yo se que es el Se&ntilde;or <br />\n  Me puede bendecir y yo se que es Cristo <br />\n  Me puede perdonar y yo se que es el Se&ntilde;or <br />\n  &nbsp; <br />\n  Yo siento en mi ser a un Cristo de poder <br />\n  Yo siento en mi ser al Esp&iacute;ritu Santo<br />\n  Yo siento en mi ser que  angeles de cielo<br />\n  acampan a mi lado y me ayudan a vencer. <br />\n  &nbsp; </p>"}, {"num": 33, "title": "Hay momentos", "html": "</p>\n<p>Hay momentos que las palabras no alcanzan<br />\n  para decirte lo que siento por ti mi buen \n  Jes&uacute;s. //<br />\n  <br />\n  Yo te agradezco Se&ntilde;or todo lo que  hiciste,<br />\n  todo lo que haces, todo lo que har&aacute;s // <br />\n&nbsp; </p>"}, {"num": 34, "title": "La siembra", "html": "</p>\n<p>Yo sembr&eacute;, Apolo reg&oacute;,<br />\n  mas el crecimiento  lo da Dios. //<br />\nSiembra la semilla,<br />\nd&eacute;jala crecer cuento Cristo venga, El te  pagara. // </p>\nSoy deudor al Se&ntilde;or,<br />\nde las almas que van sin salvaci&oacute;n. //<br />\nNo vivo yo  mas Cristo vive en mi,<br />\npara el morir es vivir en Cristo. ////&nbsp;\n<p>&nbsp;</p>"}, {"num": 35, "title": "Redimido fui (a dos voces)", "html": "Redimido  fui // por la sangre de El // <br />\nRedimido  fui por la sangre de El // <br />\nLleno de su Esp&iacute;ritu soy,<br />\nmis pecados han  sido lavados, redimido soy.&nbsp; <br />\n&nbsp; <br />\nY  as&iacute; es como // El me salvo // <br />\nAs&iacute;  es como &eacute;l me salv&oacute; // <br />\nFui al r&iacute;o y se me bautiz&oacute;,<br />\nmis pecados han sido lavados  redimido soy. <br />\n&nbsp; <br />\nY  no es todo // hay mas todav&iacute;a // <br />\nY  no es todo hay mas todav&iacute;a // <br />\nVoy a seguirle fiel cada d&iacute;a,<br />\nmis pecados han sido lavados  redimido soy. <br />\n&nbsp; <br />\nEl  va a volver // a llevarme all&aacute; // <br />\nEl  va a volver a llevarme all&aacute; // <br />\nPorque mi hogar no esta ac&aacute;,<br />\nmis pecados han sido lavados  redimido soy.</p>\n<p><br />\n  &nbsp; <br />"}, {"num": 36, "title": "No hay Dios tan grande como Tu", "html": "No hay Dios tan grande como Tu, no lo hay, no lo hay. // <br />\n  No hay Dios que pueda hacer las obras  como las que haces T&uacute;. // <br />\n  No  es con espadas ni con ej&eacute;rcitos m&aacute;s con tu <br />\n  Santo  Esp&iacute;ritu. // <br />\n  Y muchas almas se salvaran. /// Por tu  Santo Esp&iacute;ritu. <br />\n  &nbsp; </p>"}, {"num": 37, "title": "Unidos, unidos", "html": "</p>\n<p>Unidos,  unidos en su Nombre unidos. // <br />\n  Pues  en este mundo paz y amor tendremos. // <br />\n  &nbsp; <br />\n  Unidos siempre unidos, tomados de las  manos<br />\n  iremos por el mundo cant&aacute;ndole a Dios.<br />\n  La gloria de Jes&uacute;s al fin resplandecer&aacute; y<br />\n  el mundo entero sabr&aacute; que t&uacute;  eres Dios. // <br />\n  &nbsp; </p>"}, {"num": 38, "title": "Mas la senda del justo", "html": "</p>\n<p>Mas la senda del justo es como la luz de la aurora, que va en  aumento.<br />\n  Mas la senda del justo es como la luz de la aurora que va en aumento,<br />\nque va en aumento que va en aumento hasta que el d&iacute;a perfecto es\n</p>\n<p>&nbsp;</p>"}, {"num": 39, "title": "Que seria de mi", "html": "</p>\n<p>&iquest;Que seria de mi sino me hubieras  alcanzado?&nbsp;&nbsp; <br />\n  &iquest;Donde  estar&iacute;a hoy si no me hubieras perdonado?<br />\n  Tendr&iacute;a un vac&iacute;o en mi coraz&oacute;n,  vagar&iacute;a sin rumbo, sin direcci&oacute;n.&nbsp;<br />\n    Si no fuera por tu gracia y por tu amor.  //<br />\n  Seria como un p&aacute;jaro herido que se muere en el suelo,<br />\n  seria como un ciervo  que brama por agua en un desierto. <br />\n  Si no fuera por tu gracia y por tu amor.  // <br />\n  &nbsp; </p>"}, {"num": 40, "title": "Enviado soy de Dios", "html": "</p>\n<p>Enviado soy de Dios, mi mano lista esta<br />\n  para construir con el un mundo fraternal. // <br />\n  &nbsp; <br />\n  Los  &aacute;ngeles no son enviados a cambiar<br />\n  un mundo de dolor por un mundo de paz,<br />\n  me ha  tocado a mi hacerlo realidad,<br />\n  ay&uacute;dame Se&ntilde;or a hacer tu voluntad. // <br />\n&nbsp; </p>"}, {"num": 41, "title": "Si yo no tengo amor", "html": "</p>\n<p><u>Coro:</u>&nbsp; Si yo no tengo amor, yo nada soy Se&ntilde;or. // <br />\n  &nbsp; <br />\n  El amor es comprensivo, el amor es  servicial,<br />\n  el amor no tiene envidia, el amor no busca el mal <br />\n  &nbsp; <br />\n  El amor nunca se irrita, el amor no es  descort&eacute;s,<br />\n  el amor no es ego&iacute;sta, el amor nunca es dobles. <br />\n  &nbsp; <br />\n  El amor siempre perdona, siempre busca la  amistad,<br />\n  no se alegra de lo injusto solo goza la verdad. <br />\n&nbsp; </p>"}, {"num": 42, "title": "Te exaltare (Salmos 145)", "html": "</p>\n<p>Te exaltare mi Dios, mi Rey y bendecir&eacute;  tu Nombre,<br />\n  eternamente y para siempre cada d&iacute;a te bendecir&eacute;.&nbsp; <br />\nY alabare tu Nombre eternamente y para  siempre,<br />\ngrande es Jehov&aacute; y digno de suprema alabanza<br />\ny su grandeza es  inescrutable, cada d&iacute;a te bendecir&eacute;. </p>\nGeneraci&oacute;n tras generaci&oacute;n celebraran tus obras<br />\ny anunciaran tus  poderosos hechos,<br />\ncada d&iacute;a te bendecir&eacute; y alabare tu Nombre&hellip;&nbsp;\n<p>&nbsp;</p>"}, {"num": 43, "title": "Alabad a Jehová (Salmos 117)", "html": "</p>\n<p>Alabad a Jehov&aacute; naciones todos pueblos todos  alabadle,<br />\n  porque ha engrandecido sobre nosotros su misericordia. <br />\n  Y la verdad de Jehov&aacute; es para siempre  aleluya amen. // <br />\n  &nbsp; </p>"}, {"num": 44, "title": "Hay un pueblo que vive muy feliz", "html": "</p>\n<p>Hay un pueblo que vive muy feliz,<br />\n  ese  pueblo es el pueblo de Dios. // <br />\n  Ese pueblo vive as&iacute; porque un D&iacute;a conoci&oacute;  a <br />\n  Jes&uacute;s el Salvador. // <br />\n&nbsp; </p>"}, {"num": 45, "title": "Amados, amémonos unos a otros", "html": "</p>\n<p>Amados, am&eacute;monos unos a otros<br />\n  porque el  amor es de Dios<br />\n  y todo aquel que ama es nacido de Dios<br />\n  y conoce a Dios. <br />\n  El que no ama no conoce a Dios<br />\n  porque  Dios es amor,<br />\n  amados am&eacute;monos unos a otros. // <br />\n&nbsp; </p>"}, {"num": 46, "title": "Gracias Señor oh mi Dios", "html": "</p>\n<p>Gracias Se&ntilde;or oh mi Dios por permitirme  alabarte. // <br />\n  Mas como se que no morir&eacute;, all&aacute; tambi&eacute;n  te alabare. // <br />\n  &nbsp; </p>"}, {"num": 47, "title": "Estoy alegre, alegre muy alegre", "html": "</p>\n<p>Estoy alegre, alegre muy alegre,<br />\n  estoy alegre porque Cristo me  salvo//<br />\n  Gloria a Dios! Por eso canto yo canto aleluya,<br />\n  por eso canto aleluya  gloria Dios // Gloria a Dios. <br />\n&nbsp; </p>"}, {"num": 48, "title": "Yo vivo Señor porque tu vives", "html": "</p>\n<p>Yo  vivo Se&ntilde;or porque tu vives, porque tu vives Se&ntilde;or es que yo vivo. <br />\n  Me das consuelo, me das abrigo y en la  aflicci&oacute;n mi Se&ntilde;or est&aacute;s conmigo. <br />\n  &nbsp; <br />\n  Soy salvo Se&ntilde;or pues me salvaste, pues me  salvaste Se&ntilde;or eternamente,<br />\n  yo voy al cielo voy a la gloria porque Se&ntilde;or tu me  diste la victoria. <br />\n&nbsp; </p>"}, {"num": 49, "title": "Hay una unción", "html": "</p>\n<p>Hay una unci&oacute;n aqu&iacute; cayendo sobre m&iacute;,  san&aacute;ndome, cambiando mi ser. //<br />\n  Mi esp&iacute;ritu y mi alma se est&aacute;n llenando con el poder del Esp&iacute;ritu Santo.<br />\n  Mi vida nunca mas Ser&aacute; igual. //</p>\n<p>&nbsp;</p>"}, {"num": 50, "title": "La nave evangelista", "html": "La nave evangelista marcha, marcha.<br />\n  La  nave evangelista marcha para Canaan.&nbsp; <br />\n  Los  que embarcarse quieran, quieran, quieran<br />\nLos que embarcarse quieran,  bienvenidos si ser&aacute;n.</p>\n<p><u>Coro:<br />\n</u>Gloria a las alturas, los de abordo<br />\n  cantan dulcemente, gloria a las alturas a&nbsp;nuestro capit&aacute;n.&nbsp; <br />\n  &nbsp; <br />\n  Con  viento en popa vuelan, vuelan, vuelan<br />\n  Con viento en popa vuelan hacia aquel  feliz hogar.<br />\n  Felices voces se oyen, se oyen, se oyen.<br />\n  Felices voces se oyen  resonando por el mar. <br />\n  &nbsp; <br />\n  Emb&aacute;rcate conmigo, si conmigo <br />\n  Emb&aacute;rcate conmigo, tu cansado de pecar.<br />\n  Descanso te prometo, te prometo.<br />\n  Descanso te prometo en aquel feliz hogar. <br />\n  &nbsp; </p>"}, {"num": 51, "title": "Me dio un cantar", "html": "</p>\n<p>Quito El, toda mi aflicci&oacute;n, me dio  consolaci&oacute;n,<br />\n  me dio un cantar, precioso cantar,<br />\n  precioso cantar que entonare  con todo el coraz&oacute;n.<br />\nMe dio un cantar, precioso cantar.</p>\n<p><u>Coro:<br />\n</u>Me dio un cantar para decir, me levant&oacute; de perdici&oacute;n.<br />\n  Oh gloria a El,  El es mi Rey, precioso cantar es  para m&iacute;.&nbsp; <br />\n  &nbsp; <br />\n  Su luz alumbra mi andar, quita todo  pesar, me dio un cantar,<br />\n  precioso cantar, precioso cantar que entonare con coro  celestial,<br />\n  me dio un cantar, precioso cantar. <br />\n  &nbsp; </p>"}, {"num": 52, "title": "Sumérgeme", "html": "</p>\n<p>Cansado del camino, sediento de ti.<br />\n  Un desierto he cruzado,  sin fuerzas he quedado, vengo a ti. <br />\n  &nbsp; <br />\n  Luche como soldado y a veces sufr&iacute;<br />\n  y  aunque la lucha he ganado mi armadura he desgastado vengo a ti.<br />\n  <br />\n  Sum&eacute;rgeme en el r&iacute;o de tu Esp&iacute;ritu.<br />\n  Necesito refrescar este seco coraz&oacute;n  sediento de ti.//</p>\n<p>&nbsp;</p>"}, {"num": 53, "title": "Canten todos (salmo 100)", "html": "Canten  todos con mucha alegr&iacute;a,&nbsp; <br />\nHabitantes de toda la tierra<br />\nSirvan a Jehov&aacute; con alegr&iacute;a <br />\nCon regocijo ante su presencia. <br />\n&nbsp; <br />\nReconozcan  que Jehov&aacute; es Dios <br />\nEl nos hizo y no nosotros mismos<br />\nPueblo  suyo, pueblo suyo somos<br />\nY ovejas, ovejas de su prado. <br />\n&nbsp; <br />\nEntren  por sus puertas dando gracias <br />\nPor  sus cortes con gran alabanza <br />\nAlabadle,  todos alabadle <br />\nBendecid  su nombre en las alturas <br />\n&nbsp; <br />\nPorque  Jehov&aacute; el Se&ntilde;or es bueno <br />\nPara  siempre su misericordia <br />\nSu verdad es hoy y para siempre<br />\nPara  todas las generaciones. <br />\n&nbsp; <br />\nAleluya,  gloria aleluya. //// \nAm&eacute;n. <br />\n&nbsp; </p>"}, {"num": 54, "title": "Sendas", "html": "</p>\n<p>Sendas  Dios har&aacute; donde piensas que no hay <br />\n  &Eacute;l obra en maneras que no podemos  entender<br />\n  El me guiar&aacute;, a su lado estar&eacute;.<br />\n  Valor y fuerza me dar&aacute; y un camino  har&aacute;, donde no lo hay. <br />\n  &nbsp; <br />\n  Por caminos en la soledad, me guiara<br />\n  y agua en el desierto  encontrare.<br />\n  La tierra pasara, su palabra eterna es.<br />\n  El har&aacute; algo nuevo hoy. <br />\n  Sendas  Dios har&aacute;&hellip; <br />\n  &nbsp; </p>"}, {"num": 55, "title": "Ayúdame a mirar con tus ojos", "html": "</p>\n<p>Ay&uacute;dame a mirar con tus ojos<br />\nyo quiero sentir con tu  coraz&oacute;n.<br />\nNo quiero vivir mas siendo insensible<br />\na la necesidad oh Jesucristo. // </p>\n<p>&nbsp; <br />\n  Te  pido la paz para mi ciudad <br />\n  Te  pido perd&oacute;n por mi cuidad&nbsp; <br />\n  Ahora  me humillo y busco tu rostro&nbsp; <br />\n  A  quien ir&eacute; Se&ntilde;or sino a ti. //<br />\n</p>"}, {"num": 56, "title": "Eres mi fuerza", "html": "Eres mi fuerza y mi poder <br />\nY  mi tesoro quieres ser.<br />\nEres todo para m&iacute;.<br />\n<br />\nJoya preciosa de mi hogar,<br />\nnunca te  quiero abandonar.<br />\nVive en mi Se&ntilde;or. <br />\n&nbsp; <br />\nCristo, Salvador digno es tu nombre. <br />\nCristo, Redentor digno es tu nombre. <br />\n&nbsp; </p>"}, {"num": 57, "title": "En momentos así", "html": "</p>\n<p>En  momentos as&iacute;, levanto mi voz,<br />\n  levanto mi alma a Cristo.<br />\n  En momentos as&iacute;,  levanto mi ser<br />\n  levanto mis manos a el. <br />\n  Cuanto te amo Dios /// Te amo.<br />\n&nbsp; </p>"}, {"num": 58, "title": "Tal como soy Señor", "html": "</p>\n<p>Tal como soy Se&ntilde;or sin nada que ofrecer mas  que mi canci&oacute;n.<br />\n  No tengo m&aacute;s que darte pues todo es tuyo Se&ntilde;or. <br />\n  &nbsp; <br />\n  Tal como soy Se&ntilde;or sin nada que entregar  mas que el coraz&oacute;n.<br />\n  Me rindo todo a ti, t&oacute;mame Se&ntilde;or tal como soy.&nbsp; <br />\n  &nbsp; <br />\n  Ac&eacute;ptame como ofrenda de amor,<br />\n  como un  sacrificio agradable en tu honor.<br />\nGrato perfume yo quiero ser Se&ntilde;or. // </p>\n<p><br />\n  &nbsp; </p>"}, {"num": 59, "title": "Canta al Señor", "html": "</p>\n<p>Mi Cristo, mi Rey nadie es como tu.<br />\n  Toda  mi vida quiero exaltar las maravillas de tu amor. <br />\n  Consuelo, refugio, torre de fuerza y  poder.<br />\n  Todo mi ser, lo que yo soy, nunca cese de adorar.<br />\n  <br />\n  Canta al Se&ntilde;or toda la creaci&oacute;n <br />\n  Honra y poder, majestad sea al Rey <br />\n  Montes caer&aacute;n y el mar rugir&aacute; al sonar de  tu nombre.&nbsp;<br />\n  Canto con gozo al mirar tu poder <br />\n  Por siempre yo te amare y dir&eacute;&nbsp; <br />\nIncomparables promesas me das Se&ntilde;or. //</p>\n<p><br />\n  &nbsp; <br />"}, {"num": 60, "title": "Glorificad a Jehová", "html": "Glorificad a Jehov&aacute; porque su  misericordia // <br />\n  Es para siempre amen /// </p>\n<p>Es para siempre, glorificad a Jehov&aacute;. </p>\n<p>&nbsp;</p>"}, {"num": 61, "title": "Gracias Señor te damos", "html": "</p>\n<p>Gracias  Se&ntilde;or te damos por tu presencia <br />\n  Gracias  Se&ntilde;or te damos por tu poder <br />\n  Gracias Se&ntilde;or te damos por tu Esp&iacute;ritu  Santo<br /> \n  Gracias, gracias, gracias Se&ntilde;or. <br />\n  &nbsp; <br />\n  Sat&uacute;rame  Se&ntilde;or con tu presencia <br />\n  Sat&uacute;rame  Se&ntilde;or con tu poder&nbsp; <br />\n  Sat&uacute;rame  Se&ntilde;or con tu Esp&iacute;ritu Santo <br />\n  Gracias,  gracias, gracias Se&ntilde;or. // <br />\n  &nbsp; </p>"}, {"num": 62, "title": "Junto a tus pies", "html": "</p>\n<p>Junto a tus pies quiero posar, por tu  amor dejarme llevar.<br />\n  Junto a tus pies no se articular, ninguna voz tiene lugar. <br />\n  &nbsp;&nbsp; <br />\n  <u>Coro:<br />\n  </u>Junto al maestro me quiero sentar&nbsp;<br />\n  decirle le amo en oraci&oacute;n. Tocar tu  manto.<br />\n  Se&ntilde;or, lavar los pies de mi  Dios.<br />\n  Saber que mi corona es estar  junto a ti.&nbsp; <br />\n  &nbsp; <br />\n  Junto a tus pies me envuelve la paz,<br />\n  cuerdas de amor capturan  mi ser.<br />\n  Junto a tus pies, tu voz me atraviesa<br />\n  mi alma y mi ser que tanto te  anhelan. <br />\n&nbsp; </p>"}, {"num": 63, "title": "Hacemos hoy", "html": "</p>\n<p>Hacemos hoy ante tu altar un compromiso de vivir en santidad.<br />\n  Hacemos hoy ante tu altar un pacto de hombres que te quieren agradar<br />\n  con manos  limpias, coraz&oacute;n puro para ti.  &nbsp; <br />\n  Cuidare mis ojos, cuidare mis manos,<br />\n  cuidare mi coraz&oacute;n de  todo lo malo,<br />\n  de todo lo malo. No te quiero fallar jam&aacute;s. // <br />\n&nbsp; </p>"}, {"num": 64, "title": "Con mis labios", "html": "</p>\n<p>Con mis labios te bendigo, con mi boca canto tu alabanza.<br />\n  Con  mis ojos anhelo verte, mu&eacute;strate a mi.&nbsp; <br />\n  &nbsp; <br />\n  Con mi o&iacute;do quiero escucharte, con mis manos quiero tocarte.<br />\nCon mi ser lo deseo a ti, a ti.&nbsp; </p>\nBendecir&eacute; tu santo Nombre con todo mi ser. //\n<p>&nbsp;</p>"}, {"num": 65, "title": "Te haré entender (Salmos 32:8)", "html": "</p>\n<p>Te har&eacute; entender y te ense&ntilde;are el camino en que  debes andar. //&nbsp; <br />\n  Sobre ti fijare mis ojos, sobre ti, sobre  ti<br />\n  Sobre ti fijare mis ojos, mis ojos sobre ti fijare. <br />\n  &nbsp; </p>"}, {"num": 66, "title": "El Señor es digno de loor (a dos voces)", "html": "</p>\n<p>El Se&ntilde;or es digno de loor <br />\n  Vamos a darle gloria y honor <br />\n  La Biblia nos ense&ntilde;a la forma de adorar <br />\n  Debemos hacerlo en esp&iacute;ritu y verdad. // <br />\n  &nbsp; <br />\n  Vamos a dar a Cristo cantos de loor <br />\n  Vamos a estar alegres de todo coraz&oacute;n. // <br />\n  &nbsp; </p>"}, {"num": 67, "title": "El Nombre de Dios", "html": "</p>\n<p>El nombre de Dios es una torre fuerte,<br />\n  los justos entran en el y salvos son. // <br />\n  &nbsp; <br />\n  Bendito es el Nombre de Dios. /// Oh Se&ntilde;or. <br />\n  &nbsp; <br />\n  Santo es el Nombre de Dios. /// Oh Se&ntilde;or. <br />\n&nbsp; </p>"}, {"num": 68, "title": "Vamos a cantar (a dos voces)", "html": "</p>\n<p>Vamos a cantar (cantar loores a nuestro  Dios).<br /> \n  Vamos a cantar (cantar loores a  nuestro Dios). <br />\n  &nbsp; <br />\n  Que nos creo (que nos creo) <br />\n  Y nos salvo (y nos salvo) <br />\n  Vamos a cantar sin cesar a nuestro eterno \n  Dios. // <br />\n&nbsp;</p>\n<p><br />"}, {"num": 69, "title": "A ti, el Alfa y la Omega", "html": "A ti el alfa y la omega. El principio y  el fin. <br />\n  Y el gran Yo Soy, me rindo. <br />\n  A ti, el todopoderoso, el que es y que  ser&aacute;.<br />\n  Y el gran Yo soy, me entrego. <br />\n&nbsp; <br />\nYo  quiero que gobiernes mi vida, me doy en sacrificio a ti.<br />\nYo quiero que ordenes  mi caminar y que siempre viva en tu voluntad.//</p>\n<p><br />"}, {"num": 70, "title": "Hombres de valor", "html": "&iquest;Quien ira abriendo caminos, forjando mejores destinos<br />\ncon  pautas de amor para la humanidad? <br />\n&iquest;Quien dir&aacute; asumo ese reto me entrego completo<br />\ny me uno a la  causa de amor que cambia el coraz&oacute;n? <br />\n&iquest;Quien  ira a esos hombres tan desesperados? <br />\n&iquest;O quien ira a esos matrimonios acabados?<br />\nO a ese  ni&ntilde;o que esta solo y sin hogar esperando que alguien le ame hoy. <br />\n&nbsp; <br />\n<u>Coro:</u><br />\nHombres de valor, necesita Dios.&nbsp; <br />\n Hombres de valor esforzados <br />\nHombres de valor que cumplan promesas<br />\nQue sigan la ruta trazada con la mirada en su Salvador.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\n&nbsp; <br />\nHeme aqu&iacute; Se&ntilde;or, rindo mis derechos.\nHoy  vengo dispuesto a<br />\ntrazar pautas de amor para la humanidad.\nHoy aqu&iacute;, asumo ese  reto<br />\nme entrego completo y me uno a la causa de Dios que cambia el coraz&oacute;n. <br />\n&nbsp; <br />\nHombres entregados, fieles al llamado. Todo por la causa del  Se&ntilde;or. <br />\n&nbsp; <br />\n&nbsp; <br />"}, {"num": 71, "title": "El León de Juda.", "html": "El  le&oacute;n de juda, el le&oacute;n de juda. <br />\nEl  le&oacute;n de la tribu de juda es el vencedor <br />\nEl le&oacute;n de la tribu de juda es el ganador<br />\nEl le&oacute;n de la tribu de juda es quien prevaleci&oacute;<br />\nEl le&oacute;n de la tribu de juda es  mi ayudador. <br />\n&nbsp; <br />\nSuyo es el reino, el poder y la gloria, honra y autoridad.<br />\nTodo lo creado en el cielo y la tierra se postra ante su majestad. <br />\n&nbsp; <br />\nEl Se&ntilde;or es mi guerrero, el Se&ntilde;or es mi sost&eacute;n.<br />\nEl Se&ntilde;or mi  roca eterna con el nada temer&eacute;. <br />\nExpulso  a mis enemigos, en la cruz los exhibi&oacute; <br />\nMe ha dado su victoria y con el yo soy  triunfador. // </p>\n<p>&nbsp;</p>"}, {"num": 72, "title": "Amo a Cristo", "html": "</p>\n<p>Amo a Cristo, amo a Cristo. El es mi Dios  mi salvador.&nbsp; <br />\n  Amo  a Cristo, amo a Cristo porque El me amo primero a mi. // <br />\n  &nbsp; </p>"}, {"num": 73, "title": "Oh Dios es bueno", "html": "</p>\n<p>Oh Dios es bueno. ///<br />\n  Dios es bueno para m&iacute;. <br />\n  &nbsp; <br />\n  Oh aleluya. /// <br />\n  Dios es bueno para m&iacute;. <br />\n&nbsp; </p>"}, {"num": 74, "title": "La fuente", "html": "</p>\n<p>Hay una fuente de agua viva que siempre  abierta est&aacute; para ti.<br />\n  Es la fuente de amor que Jes&uacute;s abri&oacute; al morir por nos en  la cruz. <br />\n  <br />\n  <u>Coro:<br />\n  </u>Ven a mi, dice el Salvador <br />\nVen a mi, el te llama hoy <br />\nTu vendr&aacute;s y  vida tendr&aacute;s<br />\nEs la fuente de  salvaci&oacute;n. <br />\n  &nbsp; <br />\n  Una  fuente que sacia y trae paz desde el cielo a Dios volver&aacute;<br />\n  donde puede aquel que  sediento esta beber gratis saciar su sed. <br />\n  &nbsp; <br />\n  Todos pueden ser rescatados hoy de este  mundo cruel y falaz.<br />\n  Este mundo esta casi al perecer si eres fiel lugar  tendr&aacute;s. <br />\n  &nbsp; </p>"}, {"num": 75, "title": "Celebrad a Cristo", "html": "</p>\n<p>Celebrad a Cristo, celebrad. //// <br />\n  &nbsp; <br />\n  El vive, el vive y por siempre el  reinara.<br />\n  El vive, el vive, vamos a celebrad que  nuestro Se&ntilde;or resucito. <br />\n  &nbsp; </p>"}, {"num": 76, "title": "Bendecido sea el Señor", "html": "</p>\n<p>Bendecido sea el Se&ntilde;or, digno es de  nuestra adoraci&oacute;n.<br />\n  Vidas santas levantamos ante &Eacute;l.<br />\n  <br />\nCantando bendecido sea, bendecido sea,<br />\nbendecido sea el Se&ntilde;or. (se repite el canto) </p>\n  \n<p>&nbsp;</p>"},
{"num": 77, "title": "Porque grande es Jehová", "html": "</p>\n<p>Porque grande es Jehová y digno de suprema<br />\n  alabanza. Adorar a Jehová en la hermosura de <br />\n  la santidad. //<br />\n <br> Y temed delante de Él toda la tierra. /// <br />\n Porque grande es Jehová, Porque grande es Jehová<br />\n  porque grande es Jehová nuestro Dios.<br />\n</p>"}, {"num": 78, "title": "Hay gran voz", "html": "</p>\n<p>Hay gran voz de júbilo y de salvación <br />\n entre los justos del Señor.// <br />\n  La diestra de Hashem poderosa es, <br />\n  la diestra de el Señor.<br />\n  La diestra de Hashem poderosa es,<br />\n//su mano reina en alto//<br />\n ¡¡¡Hay gran voz!!!<br />\n</p>"}, {"num": 79, "title": "Jesús, Señor de la creación", "html": "</p>\n<p>Jes&uacute;s, Se&ntilde;or de la creaci&oacute;n. Siendo en forma de Dios,<br />\n  se  despojo de si mismo.<br />\n  Tom&oacute; la semejanza del hombre<br />\n  y siendo puro y sin mancha  entre nosotros vivi&oacute;<br />\n  y asimismo se humillo tomando forma de siervo.<br />\n  Hasta su  vida entregar y en una cruz terminar.&nbsp; <br />\n  &nbsp; <br />\n  M&aacute;s Dios a lo sumo lo exalt&oacute;<br />\n  y su Nombre  engrandeci&oacute;<br />\n  para que ante su autoridad<br />\n  t\n  oda rodilla se doble<br />\n  y toda lengua  confiese que <br />\n  Jes&uacute;s  es el Se&ntilde;or. // <br />\n&nbsp; </p>"}, {"num": 80, "title": "Padre nuestro", "html": "</p>\n<p>Padre  nuestro que estas en los cielos <br />\n  Santificado  sea tu Nombre&nbsp; <br />\n  Grande  es tu reino, sea tu voluntad&nbsp; <br />\n  En  los cielos como en la tierra&nbsp; <br />\n  Danos  hoy el pan de cada d&iacute;a <br />\n  Y perdona nuestras deudas No nos dejes  caer en la tentaci&oacute;n&nbsp; M&aacute;s l&iacute;branos de  todo mal. <br />\n  &nbsp; <br />\n  Porque  tuyo, tuyo es el reino <br />\n  Tuya  toda la gloria <br />\n  Tuyo,  tuyo el poder<br />\n  Por todos los siglos para siempre. // Amen.<br />\n</p>"}, {"num": 81, "title": "Como el Ciervo", "html": "</p>\n<p>Como el ciervo con sed busca el r&iacute;o,<br />\n  oh  Dios m&iacute;o te busco a ti.<br />\n  Mi coraz&oacute;n te desea y anhela adorarte mi Se&ntilde;or.<br />\n  <br />\n  <u>Coro:<br />\n  </u>Fuerza y escudo eres para m&iacute;.<br />\n  Mi esp&iacute;ritu se rinde a ti.<br />\n  Mi  coraz&oacute;n te desea y anhela  adorarte mi Se&ntilde;or. <br />\n  &nbsp; <br />\n  Vales m&aacute;s que el oro y la plata, t&uacute; me  puedes satisfacer.<br />\n  Mi coraz&oacute;n te desea y anhela adorarte mi Se&ntilde;or.<br />\n&nbsp; </p>"}, {"num": 82, "title": "Mira que te mando (Josué 1:9)", "html": "</p>\n<p>Mira que te mando que seas valiente&nbsp; <br />\n  No temas ni desmayes siervo del Se&ntilde;or //<br />\n  Jehov&aacute; tu Dios ira contigo a dondequiera que fueres con El //<br />\n  <br />\n  L&aacute;mpara es a mis pies tu palabra <br />\n  Y lumbrera a mi camino // <br />\n  Jehov&aacute;  tu Dios ir&aacute; contigo a dondequiera que fueres con El //<br />\n  </p>"}, {"num": 83, "title": "Pon tus ojos en los ojos del Señor", "html": "Pon  tus ojos en los ojos del Se&ntilde;or de Galilea<br />\n  Pon tus ojos en los ojos del Se&ntilde;or  que calma la mar.<br />\n  Si el Se&ntilde;or vive hoy y por siempre vivir&aacute; <br />\n  Pon tus ojos en los ojos del Se&ntilde;or que calma  la mar.<br />\n  <br />\n  Pon tus manos en las manos del Se&ntilde;or de  Galilea.<br />\n  Pon tus manos en las manos del Se&ntilde;or que calma la mar.<br />\n  Si el Se&ntilde;or  vive hoy y por siempre vivir&aacute;<br />\n  pon tus manos en las manos del Se&ntilde;or que calma la  mar.<br />\n  <br />\n  Pon  tus pasos en los pasos del Se&ntilde;or de Galilea<br />\n  Pon tus pasos en los pasos del  Se&ntilde;or que calma la mar.<br />\n  Si el Se&ntilde;or vive hoy y por siempre vivir&aacute;,<br />\n  pon tus  pasos en los pasos del Se&ntilde;or que calma la mar. </p>\n<p>Pon tus ojos y tus manos y tus pasos<br />\n en los ojos en las manos en los  pasos del Se&ntilde;or de Galilea.<br />\n  Pon tus ojos y tus manos y tus pasos <br />\n en los ojos en  las manos en los pasos del Se&ntilde;or que calma la mar.<br />\n  Si el Se&ntilde;or vive hoy y por  siempre vivir&aacute;.<br />\n  Por tu ojos y tus manos y tus pasos <br />\n en los ojos en las manos en  los pasos del Se&ntilde;or que calma la mar.<br />\n</p>"}, {"num": 84, "title": "Mi Dios es bueno", "html": "</p>\n<p>Aleluya,  aleluya. //// <br />\n  Mi Dios es bueno, aleluya.//<br />\n  Me ha  salvado, aleluya <br />\n  Me  ha perdonado, aleluya. <br />\n  Aleluya.  Aleluya. //// <br />\n  &nbsp; </p>"}, {"num": 85, "title": "Aleluya, aleluya.", "html": "</p>\n<p>Aleluya,  aleluya, aleluya al Se&ntilde;or. //<br />\n  En el cielo y en la tierra te adoramos oh  Se&ntilde;or.<br />\n  Eres digno de alabanza y de suprema adoraci&oacute;n.&nbsp; <br />\n  &nbsp; <br />\n  Te  proclamamos Se&ntilde;or. //// <br />\n  Aleluya,  aleluya, aleluya al Se&ntilde;or. // <br />\n&nbsp; </p>"}, {"num": 86, "title": "En mi corazón hay una canción", "html": "</p>\n<p>En mi coraz&oacute;n hay una canci&oacute;n que demuestra mi pasi&oacute;n,<br />\n  para mi  Rey y mi Se&ntilde;or, para Aquel que me amo. // <br />\n  &nbsp; <br />\n  Hermoso  eres mi Se&ntilde;or.\n  Hermoso  eres tu amado m&iacute;o <br />\n  Tu  eres la fuente de mi vida y  el anhelo de mi coraz&oacute;n. // <br />\n&nbsp; </p>"}, {"num": 87, "title": "Yo lo haré", "html": "</p>\n<p>Heme aqu&iacute; Se&ntilde;or, env&iacute;ame.<br />\n  Si te puedo servir aqu&iacute; estoy.<br />\nEn  tus manos Se&ntilde;or como el barro soy,<br />\npara que me hagas a tu imagen, t&oacute;mame.</p>\n<p><u>Coro:<br />\n</u>Yo lo har&eacute;, te obedecer&eacute; <br />\n  Sin reservas ni condiciones <br />\n  Te seguir&eacute;. // <br />\n  &nbsp; <br />\n  Si  mi vida te sirve la entrego a ti,<br />\n  hoy la rindo a tus pies Se&ntilde;or Jes&uacute;s.<br />\n  Te  entrego mi ser y mi coraz&oacute;n,<br />\n  no hay sentido en vivir si no es para ti. <br />\n  &nbsp; </p>"}, {"num": 88, "title": "Señor eres fiel", "html": "</p>\n<p>Se&ntilde;or  eres fiel y tu misericordia eterna. //  &nbsp; <br />\n  Gente de toda lengua y naci&oacute;n, <br />\n  De generaci&oacute;n a generaci&oacute;n.&nbsp; <br />\nTe adoramos hoy aleluya, aleluya,<br />\nte adoramos hoy, eres Se&ntilde;or.  //<br />\n</p>"}, {"num": 89, "title": "Ama si quieres ser feliz", "html": "</p>\n<p>Ama si quieres ser feliz, ama y todo  cambiara. <br />\n  Ama y as&iacute; comprender&aacute;s la alegr&iacute;a de  vivir. <br />\n  El que ama a su hermano un abrazo le  dar&aacute;. <br />\n  Ama si quieres ser feliz, ama y todo  cambiara.<br />\n  Ama y as&iacute; comprender&aacute;s la alegr&iacute;a de vivir. <br />\n  &nbsp; </p>"}, {"num": 90, "title": "Da una sonrisa", "html": "</p>\n<p>Da una sonrisa una sonrisa abierta.<br />\n  Sonrisa cierta llena de amor. // <br />\n  Quien  tiene a Jes&uacute;s vive para cantar,<br />\n  esta siempre sonriendo aunque le vaya mal.<br />\n  Tropieza aqu&iacute; &iexcl;Uy! Se cae all&aacute;,<br />\n  se levanta de nuevo y se pone a cantar. // <br />\n&nbsp; </p>"}, {"num": 91, "title": "Cuan bello es el Señor", "html": "</p>\n<p>Cuan bello es el Se&ntilde;or,<br />\n  cuan hermoso es  el Se&ntilde;or,<br />\n  cuan bello es el Se&ntilde;or,<br />\n  hoy le quiero adorar // <br />\n  La belleza de mi Se&ntilde;or <br />\n  Nunca se agotar&aacute; <br />\n  La hermosura de mi Se&ntilde;or <br />\n  Siempre resplandecer&aacute;. //&nbsp;&nbsp; <br />\n&nbsp; </p>"}, {"num": 92, "title": "Hay momentos tan especiales", "html": "</p>\n<p> Hay momentos tan especiales junto a ti  Se&ntilde;or. // <br />\n  En los que puedo sentir tu presencia <br />\n  En los que puedo recostarme en ti <br />\n  En los que puedo yo tomar de tu amor. // <br />\n&nbsp; </p>"}, {"num": 93, "title": "Yo quiero mas de ti", "html": "</p>\n<p>Yo quiero mas de ti y habitar en tu presencia<br />\n  menguar para que  crezcas tu y cada d&iacute;a ser m&aacute;s como tu // <br />\n  Quebranta mi coraz&oacute;n, quebranta mi vida,<br />\n  te entrego mi  voluntad a ti.<br />\n  Todo lo que soy Se&ntilde;or, todo cuanto tengo es tuyo.<br />\n  Yo quiero  menguar para que crezcas t&uacute;. // <br />\n&nbsp; </p>"}, {"num": 94, "title": "No hay un saludo mas lindo", "html": "</p>\n<p>No hay un saludo m&aacute;s lindo que el saludo  del cristiano. // <br />\n  Te da la mano y te dice Dios te bendiga  mi hermano. // <br />\n  Dios te bendiga // Dios te bendiga mi hermano.<br />\n</p>"}, {"num": 95, "title": "Yo te busco", "html": "</p>\n<p>Yo te busco, yo te busco con fuego en mi coraz&oacute;n. <br />\n  Yo  te busco, yo te busco recibe mi adoraci&oacute;n// <br />\n  &nbsp; <br />\n  Te anhelo, te necesito, te amo mas que a  mi ser. // <br />\n  &nbsp; </p>"}, {"num": 96, "title": "Mi necesidad eres Tu", "html": "</p>\n<p>Mi  necesidad eres T&uacute;. //&nbsp; <br />\n  Temprano  en la ma&ntilde;ana y al anochecer. <br />\n  Mi  necesidad eres T&uacute;. <br />\n  &nbsp; <br />\n  Todo  mi mundo eres T&uacute;. // <br />\n  Temprano en la ma&ntilde;ana y al anochecer<br />\n  Todo  mi mundo eres T&uacute;. <br />\n  &nbsp; <br />\n  Toda  mi vida eres T&uacute;. // <br />\n  Temprano en la ma&ntilde;ana y al anochecer<br />\n  Toda  mi vida eres T&uacute;. <br />\n  &nbsp; <br />\n  Todo  mi gozo eres T&uacute;. // <br />\n  Temprano  en la ma&ntilde;ana y al anochecer. <br />\n  Todo  mi gozo eres T&uacute;. <br />\n  &nbsp; </p>"}, {"num": 97, "title": "Yo tengo gozo en mi alma.", "html": "</p>\n<p>Yo  tengo gozo en mi alma,<br />\n  gozo en mi alma,<br />\n  gozo en mi alma y en mi ser.<br />\n  Y es como  r&iacute;os de agua viva,<br />\n  r&iacute;os de agua viva,<br />\n  r&iacute;os de agua viva en m&iacute; ser.<br />\n  <br />\n  Yo tengo paz en mi alma,<br />\n  paz en mi alma,<br />\n  paz en mi alma y en mi ser.<br />\n  Y es como r&iacute;os de agua viva,<br />\n  r&iacute;os de agua viva,<br />\n  r&iacute;os de agua viva en m&iacute; ser.<br />\n  <br />\n  Yo tengo a Cristo en mi alma,<br />\n  a Cristo en mi alma,<br />\n  a Cristo en  mi alma y en mi ser.<br />\n  Y es como r&iacute;os de agua viva,<br />\n  r&iacute;os de agua viva,<br />\n  r&iacute;os de  agua viva en m&iacute; ser. <br />\n&nbsp; </p>"}, {"num": 98, "title": "Cada mañana", "html": "</p>\n<p>Cada ma&ntilde;ana al despertar<br />\n  y por la noche al descansar,<br />\n  agradezco tus bondades a mi vida<br />\n  por todo lo que me permites disfrutar.// <br />\n  <br />\n  Aleluya, aleluya, aleluya,<br />\n  agradecido estoy por Tu bondad. //<br />\n</p>"}, {"num": 99, "title": "Nos amamos todos", "html": "</p>\n<p>Nos amamos todos, nos amamos todos,<br />\n  nos amamos todos porque  estamos en Cristo.<br />\n  Se necesita Cristo,  se necesita Cristo,<br />\n  se necesita Cristo para amarnos todos.<br />\n  <br />\n  Amamos a ____________ <br />\n  Amamos a ____________ <br />\n  Amamos a ____________<br />\n  porque estamos en Cristo.<br />\n  Se necesita Cristo para amarnos todos. <br />\n&nbsp; </p>"}, {"num": 100, "title": "No a nosotros", "html": "</p>\n<p>Es por ti que juntos hoy estamos aqu&iacute; <br />\n  Fue  tu amor que de la oscuridad nos saco <br />\n  A  una voz venimos hoy delante de ti para darte el honor. <br />\n  <br />\n  <u>Coro:<br />\n  </u>No a nosotros oh Dios si no a Tu <br />\n  Nombre sea dada la gloria. /// <br />\n  &nbsp; <br />\n  Eres tu, motivo de nuestra adoraci&oacute;n <br />\n  La verdad que nuestro coraz&oacute;n libero<br />\n  Nadie mas es digno del honor recibir<br />\n  Te lo  damos a ti. <br />\n  &nbsp; </p>"}, {"num": 101, "title": "Debes platicar con Cristo", "html": "</p>\n<p>Perdido  andaba yo mas Cristo me encontr&oacute;,<br />\n  un rayo de celeste luz mi alma alumbr&oacute;.<br />\n  Mi  nombre escrito esta en la mansi&oacute;n de paz,<br />\n  mas solo porque hable con Cristo  salvo soy. <br />\n  &nbsp;&nbsp;&nbsp; <br />\n  <u>Coro:<br />\n  </u>Ahora, debes platicar con Cristo,<br />\n  Dile, todo lo que te entristece <br />\n  Oye, oye tu  oraci&oacute;n contesta, si contestara.<br />\n  Mas cuando sientas que El oy&oacute; tus ruegos<br />\n  y tu sientas del amor  el fuego.<br />\n  Dile al mundo que  el hablar con&nbsp;Cristo es la  raz&oacute;n. <br />\n  &nbsp; <br />\n  A  veces triste estoy y caminando voy<br />\n  en medio de la densa nube del dudar.<br />\n  La  neblina del mar me oculta el final<br />\n  y solo porque hable con Cristo luz habr&aacute;.</p>\n<p>Ni dudas, ni temor podranme atormentar,<br />\n  Cristo es mi amigo fiel me  ayudara.<br />\n  El oye mi oraci&oacute;n, conoce mi aflicci&oacute;n,<br />\n  mas solo porque hable con el  me sostendr&aacute;.<br />\n</p>"}, {"num": 102, "title": "Oh supremo Señor", "html": "</p>\n<p>Oh  supremo Se&ntilde;or cuan precioso es tu amor <br />\n  Te  doy gloria y honor por morir en la cruz <br />\n  No  lo puedo saber como sufri&oacute; tu ser <br />\n  Pero  gracias te doy por tu perd&oacute;n ofrecer. // <br />\n  &nbsp; <br />\n  Por  tu gran coraz&oacute;n yo te ofrezco este son <br />\n  Practicando  mi don de cantarte Se&ntilde;or <br />\n  Que  alegr&iacute;a hay en mi por bendecirte as&iacute; <br />\n  Yo  te alabo Se&ntilde;or por olvidar lo que fui. // <br />\n  &nbsp; </p>"}, {"num": 103, "title": "Es muy bueno estar reunidos", "html": "</p>\n<p>Es muy bueno estar reunidos caminando en la luz. // <br />\n  Pues no hay nada mejor que compartir nuestras vidas en Jes&uacute;s.  // <br />\n  Compartiendo nuestras vidas reflejamos Su amor. // <br />\n  Pues no hay nada mejor que compartir nuestras vidas en Jes&uacute;s.  // <br />\n  &nbsp; </p>"}, {"num": 104, "title": "En el calvario", "html": "</p>\n<p>En el calvario mi Jesucristo muri&oacute; en la cruz por ti, por  m&iacute;.&nbsp; <br />\n  Como podr&iacute;amos pagar por ello, como podr&iacute;amos? D&iacute;melo si. // <br />\n  &nbsp; <br />\n  Pagar por ello nunca podr&iacute;amos y el solo pide fidelidad.&nbsp; <br />\n  Serle por siempre agradecidos y no ofenderle ya nunca m&aacute;s. // <br />\n  &nbsp; </p>"}, {"num": 105, "title": "Vine a alabar a Dios", "html": "</p>\n<p>Vine  a alabar a Dios. // <br />\n  Vine a alabar su Nombre Se&ntilde;or<br />\n  Vine a alabar a Dios. <br />\n  &nbsp; <br />\n  El vino a mi vida en un d&iacute;a muy especial<br />\n  Cambio mi coraz&oacute;n y me mostr&oacute; un camino mejor<br />\n  y esa es la raz&oacute;n por la que digo  que Vine a alabar a Dios. <br />\n  &nbsp; </p>"}, {"num": 106, "title": "Solo Dios hace al hombre feliz", "html": "</p>\n<p>Solo  Dios hace al hombre feliz. // <br />\n  La  vida pasa, todo se acaba<br />\n  Solo Dios hace al hombre feliz<br />\n</p>"}, {"num": 107, "title": "Estoy alegre 7 veces", "html": "</p>\n<p>Estoy  alegre, estoy alegre,\n  estoy alegre,<br />\n  alegre, alegre, alegre, alegre, alegre,  alegre.<br />\n  Estoy alegre, estoy alegre, estoy alegre porque Cristo me salvo.<br />\n  <br />\n  Por eso canto, por eso canto, por eso  canto<br />\n  alegre, alegre, alegre, alegre, alegre, alegre.<br />\n  Por eso canto, por eso  canto, por eso canto aleluya gloria Dios.&nbsp; <br />\n&nbsp; </p>"}, {"num": 108, "title": "El me Liberó", "html": "</p>\n<p>El  me libero, el me rescato mis pecados el borro.<br />\n  Ahora libre soy por su gracia,  &iexcl;Bendito sea el se&ntilde;or! //&nbsp; <br />\n  Si t&uacute; quieres ser libre ven rec&iacute;belo, y  recibir&aacute;s tu bendici&oacute;n. <br />\n  Si t&uacute; quieres ser libre ven rec&iacute;belo y  recibir&aacute;s la salvaci&oacute;n.&nbsp; <br />\n&nbsp; </p>"}, {"num": 109, "title": "Sacrificio de Alabanza", "html": "</p>\n<p>Traemos sacrificio de alabanza a la casa  del \n  Se&ntilde;or // <br />\n  Ofrecemos para ti, sacrificio de  gratitud. <br />\n  Ofrecemos para ti, sacrificio de amor. <br />\n&nbsp; </p>"}, {"num": 110, "title": "Veo al señor.", "html": "</p>\n<p>Veo  al se&ntilde;or, alto y sublime,<br />\n  sentado sobre el trono de mi ser&hellip; // <br />\n  &Eacute;l es santo /// <br />\n  Sentado sobre el trono de m&iacute; ser. <br />\n&nbsp; </p>"}, {"num": 111, "title": "Aquí estoy mi Dios.", "html": "Aqu&iacute; estoy mi Dios para alabarte,<br />\n  para  bendecirte en esp&iacute;ritu y verdad // <br />\n  &nbsp; <br />\n  <u>Coro</u>:<br />\n  Por eso te pido, Esp&iacute;ritu Santo llena  toda<br />\n  mi vida con tu Divina presencia. // <br />\n  &nbsp; <br />\n  Que  mi alabanza llegue a tu presencia como<br />\n  olor fragante muestra de amor para ti. <br />\n  &nbsp; <br />\nTambi&eacute;n  deseo Dios consagrar mi vida y<br />\nexaltar tu Nombre con mi manera de vivir.<br />\n</p>"}, {"num": 112, "title": "Las mansiones celestiales", "html": "</p>\n<p>Las mansiones celestiales preparadas ya est&aacute;n,<br />\n  Cristo el Rey  de gloria nos las fue a preparar. <br />\n  &nbsp; <br />\n  <u>Coro:<br />\n  </u>Nos llevar&aacute;, nos llevar&aacute; hacia aquel  lugar//<br />\n  Cristo el Rey de gloria sus promesas, cumplir&aacute;. <br />\n  &nbsp; <br />\n  Estad listos y velad que ese d&iacute;a llegar&aacute;,<br />\n  Cristo el Rey de  gloria ya muy pronto volver&aacute;. <br />\n&nbsp; </p>"}, {"num": 113, "title": "En el hogar", "html": "</p>\n<p>En el hogar, en el hogar, en el hogar se  necesita a Jes&uacute;s //&nbsp; <br />\n  Mira que feliz se vive, mira que feliz se  vive con Jes&uacute;s en el hogar // <br />\n  &nbsp; </p>"}, {"num": 114, "title": "Solo en Jesús", "html": "</p>\n<p>Solo en Jes&uacute;s est&aacute; mi fe,  mi esperanza y mi canci&oacute;n.<br />\n  Piedra angular, firme sost&eacute;n inconmovible en la  aflicci&oacute;n.&nbsp; <br />\n  Cuan grande amor, inmensa paz, en el temor o  adversidad.<br />\n  Consolador, amigo fiel. Yo en su amor me sostendr&eacute;.&#769;&nbsp; <br />\n  &nbsp; <br />\n  Solo en Jes&uacute;s, mi redentor,  todo el poder de Dios en &Eacute;l.<br />\n  Regalo que fue por amor, vino a salvar al pecador. <br />\n  Ah&iacute; &#769;  en la cruz  cuando &Eacute;l muri&oacute;. El plan de Dios ah&iacute; &#769;  cumpli&oacute;. <br />\n  Pues mi pecado &Eacute;l cargo, en&#769;&nbsp;&nbsp;  su aflicci&oacute;n vida me dio. <br />\n  &nbsp; <br />\n  En un sepulcro &Eacute;l yaci&oacute;, el cuerpo inerte del  Se&ntilde;or.<br />\n  Mas el tercer d&iacute;a lleg&oacute;, resucit&oacute; en gloriosa luz. <br />\n  Ahora ya mi Salvador, lav&oacute;  toda mi iniquidad de &Eacute;l suyo soy,<br />\n  &Eacute;l m&iacute;o es, pues con su sangre me compr&oacute;. <br />\n  &nbsp; <br />\nNo m&aacute;s temor, no m&aacute;s maldad. Sea el poder de  Cristo en m&iacute;.<br />\nDesde el nacer hasta el morir, mi vida se la doy a &Eacute;l.<br />\nNing&uacute;n poder, ni tierra o mar, de &Eacute;l me arrebatar&aacute;.//<br />\nSi muero o &Eacute;l  viene otra vez, en su poder firme estar&eacute;//<br />\n</p>"}, {"num": 115, "title": "Cristo, Nombre glorioso", "html": "</p>\n<p>Cristo, Nombre glorioso <br />\n  Precioso Salvador bello Se&ntilde;or <br />\n  Emmanuel Dios con nosotros <br />\n  Palabra viva mi Redentor. // <br />\n  &nbsp; </p>"}, {"num": 116, "title": "Somos pueblo", "html": "</p>\n<p>Somos  pueblo, pueblo adquirido por Dios Naci&oacute;n santa,<br />\n  real sacerdocio linaje escogido  por Dios // <br />\n  Para  anunciar las virtudes de Aquel, que nos llam&oacute; de tinieblas a luz //<br />\n  Admirable,  somos los hijos de luz. <br />\n  &nbsp; <br />\n  Tiempo de vivir, tiempo de morir, tiempo  de llorar,<br />\n  tiempo de re&iacute;r, tiempo de animar y de redarg&uuml;ir.<br />\n  !Hoy es tiempo! <br />\n  &nbsp; <br />\n  Tiempo de aprender, tiempo de ense&ntilde;ar,<br />\n  tiempo de hablar,  tiempo de callar, tiempo de sembrar y de cosechar.<br />\n  !Hoy es tiempo! <br />\n  &nbsp; <br />\n  Hoy es tiempo que seamos, oh <br />\n  Ese pueblo glorioso fiel y victorioso de  Dios. // <br />\n&nbsp; </p>"}, {"num": 117, "title": "Todo les ayuda", "html": "</p>\n<p>Todo  (todo) les ayuda (les ayuda)<br /> \n  para bien a  los (para bien a los) que te aman (que te aman) <br />\n  &nbsp; <br />\n  Al ver que he perdido el control, a ti mi  alma levantare.<br />\n  Hay cosas que no comprender&eacute; pero yo confiare en ti. <br />\n  &nbsp; <br />\n  Los  misterios se acabaran, lo escondido se descubrir&aacute;<br />\n  y lo equivocado cambiara al  andar en tu perfecta luz.  &nbsp; <br />\n  Oh Se&ntilde;or, oh Se&ntilde;or te amamos.&nbsp;&nbsp; <br />\n&nbsp; </p>"}, {"num": 118, "title": "Quiero alabarte", "html": "</p>\n<p>Quiero alabarte m&aacute;s y m&aacute;s a&uacute;n. // <br />\n  Mostrar tu voluntad, tu gracia conocer  quiero alabarte. </p>\n<p>Las aves del cielo cantan para ti,<br />\n  las bestias del campo reflejan tu  poder.<br />\n  Quiero yo cantar, quiero levantar mi canto a ti.<br />\n</p>"}, {"num": 119, "title": "Me gustaría compartir", "html": "</p>\n<p>Me gustar&iacute;a compartir, la dicha de vivir<br />\n  siguiendo siempre a mi Jesus y as&iacute; ser muy feliz.<br />\n  A su lado siempre ir&eacute; con el caminare <br />\n  hablando a todos de su amor y as&iacute; ser muy  feliz. <br />\n  En El halle la vida y tambi&eacute;n su perd&oacute;n,<br />\n  dale tu coraz&oacute;n y &Eacute;l  te dar&aacute; alegr&iacute;a // <br />\n&nbsp; </p>"}, {"num": 120, "title": "Gracias te doy", "html": "</p>\n<p>Gracias, gracias te doy llegaste a mi vida y el mismo no soy.<br />\n  Canto, canto para ti. T&uacute; das la salvaci&oacute;n y me la das m&iacute;. <br />\n  En las tinieblas, eres mi luz <br />\n  Cuando  me enfermo me das salud <br />\n  Si ando triste,  veo tu faz <br />\n  Y  si me pierdo se que t&uacute; me guiaras. // <br />\n&nbsp; </p>"}, {"num": 121, "title": "Damos honor a ti", "html": "</p>\n<p>Damos honor a ti, damos honor a ti;<br />\n  Creador de vida eres t&uacute;. <br />\n  Damos honor a ti, damos honor a ti;<br />\n  porque no hay otro Dios  como t&uacute;. // <br />\n  &nbsp; <br />\n  Rey de reyes, admirable, eres el  principio y fin.<br />\n  Soberano y sublime eres nuestro salvador.// <br />\n&nbsp; </p>"}, {"num": 122, "title": "En el Nombre de Jesus", "html": "</p>\n<p>En el Nombre de Jesus me acerco ante tu presencia Oh Se&ntilde;or.<br />\n  En  el Nombre de Jesus para darte mi ofrenda oh Se&ntilde;or. <br />\n  &nbsp; <br />\n  Es  alabanza y adoraci&oacute;n lo que te ofrezco <br />\n  Se&ntilde;or  en el Nombre maravilloso de Jesus. // <br />\n  &nbsp; <br />\n&nbsp; </p>"}, {"num": 123, "title": "Eres digno", "html": "</p>\n<p>Eres digno de abrir los sellos Se&ntilde;or//<br />\n  Porque fuiste inmolado, con tu poder me has levantado. <br />\n  Porque fuiste inmolado y tu sangre me ha salvado. <br />\nGloria  a Dios, gloria a Dios. Gloria a Dios, gloria a Dios.<br />\n</p>"}, {"num": 124, "title": "Esperar en ti", "html": "Esperar  en ti, dif&iacute;cil s&eacute; que es <br />\nMi  mente dice no, no es posible. <br />\nPero  mi coraz&oacute;n confiado est&aacute; en ti,&nbsp; <br />\nT&uacute;  siempre has sido fiel, me has sostenido. <br />\n&nbsp; <br />\nCoro <br />\nY  esperar&eacute; pacientemente <br />\nAunque la duda me atormente<br />\nYo no conf&iacute;o  con la mente<br />\nLo hago con el coraz&oacute;n. <br />\n&nbsp; <br />\nY  esperar&eacute; en la tormenta <br />\nY aunque tardare tu respuesta,<br />\nYo  confiar&eacute; en tu providencia,<br />\nT&uacute; siempre tienes el control. <br />\n&nbsp; <br />"}, {"num": 125, "title": "Dame tus ojos", "html": "Dame tus ojos quiero ver dame tus palabras, quiero hablar,<br />\nDame tu parecer <br />\nDame tus pies, yo quiero ir, Dame tus deseos para sentir,<br />\nDame  tu parecer <br />\nDame  lo que necesito Para ser como tu <br />\n&nbsp; <br />\n<u>Coro:<br />\n</u>Dame tu voz, dame tu aliento <br />\nToma  mi tiempo es para ti,<br />\nDame el camino que debo seguir,<br />\nDame tus sue&ntilde;os, tus  anhelos<br />\nTus pensamientos, tu sentir,<br />\nDame tu vida para vivir // <br />\n&nbsp; <br />\nD&eacute;jame ver lo que t&uacute; ves, Dame de tu  gracia, tu poder,<br />\nDame tu coraz&oacute;n,<br />\nD&eacute;jame ver en tu interior para ser cambiado  por tu amor,<br />\nDame tu coraz&oacute;n. Dame lo que necesito para ser como t&uacute;. <br />\n</p>\n<p>  <br />"}, {"num": 126, "title": "Mirarte solo a ti Señor", "html": "///Mirarte solo a ti Se&ntilde;or/// Y no mirar  atr&aacute;s. <br />\n  &nbsp; <br />\n  Coro <br />\n  Seguir  tu caminar, Se&ntilde;or, <br />\n  Seguir sin desmayar, Se&ntilde;or.<br />\n  Postrarme  ante tu altar, Se&ntilde;or Y no mirar atr&aacute;s.</p>\n<p>Seguirte&hellip; Servirte&hellip; Amarte&hellip;<br />\n</p>"}, {"num": 127, "title": "Aquí estoy yo", "html": "</p>\n<p>No quiero perder, las cosas que me quedan  por hacer,<br />\n  las cosas que me quedan por vivir en ti<br />\n  No quiero olvidar las cosas  que planeaste para m&iacute;,<br />\n  los sue&ntilde;os que me diste lograre por ti <br />\n  &nbsp; <br />\n  <u>Coro:<br />\n  </u>No tienes que buscar a nadie m&aacute;s yo  quiero ir<br />\n  aqu&iacute; est&aacute; mi tiempo aqu&iacute; est&aacute;n mis horas.<br />\n  Aqu&iacute; estoy yo Mi vida es  para ti y en ti la quiero yo invertir,<br />\n  aqu&iacute; est&aacute;n mis manos, aqu&iacute; est&aacute; mi voz, aqu&iacute; estoy yo <br />\n  &nbsp; <br />\n  Listo quiero estar, los dones que me  diste voy a usar<br />\n  los a&ntilde;os que me has dado vivir&eacute; por ti.<br />\n  Voy a conquistar la  tierra que me diste<br />\n  y sin dudar hare lo que me pidas vivir&eacute; por ti <br />\n&nbsp; </p>"}, {"num": 128, "title": "El Espíritu de Dios", "html": "</p>\n<p>El Esp&iacute;ritu de Dios est&aacute; en este lugar,<br />\n  el Esp&iacute;ritu de Dios se mueve en este lugar<br />\n  est&aacute; aqu&iacute; para consolar, est&aacute; aqu&iacute;  para liberar<br />\n  est&aacute; aqu&iacute; para guiar, el Esp&iacute;ritu de Dios est&aacute; aqu&iacute;// <br />\n  //Mu&eacute;vete en m&iacute;, mu&eacute;vete en mi toma mi  mente mi coraz&oacute;n<br />\n  llena mi vida de tu amor, mu&eacute;vete  en mi<br />\n  Dios Esp&iacute;ritu mu&eacute;vete en mi// <br />\n&nbsp; </p>"}, {"num": 129, "title": "De tal manera", "html": "</p>\n<p>De tal manera me am&oacute;, que su vida no  escatim&oacute;.<br />\n  Hasta el final &Eacute;l se entreg&oacute;, y a la muerte fue porque &Eacute;l me am&oacute;. \n  <br />\n  De tal manera me am&oacute;, y no hay forma en que podr&eacute; pagar<br />\n  el  precio de su grande amor. Pero toda mi alma quiero dar <br />\n  &nbsp; <br />\n  CORO <br />\n  Por  su amor yo vivir&eacute;, <br />\n  De  su amor yo cantar&eacute;, <br />\n  Con mi Jes&uacute;s caminar&eacute;<br />\n  Porque El me amo a m&iacute;. <br />\n  Por  su amor yo vivir&eacute;, <br />\nDe  su amor yo cantar&eacute;, </p>\n<p>Con mi Jes&uacute;s caminar&eacute;&nbsp; Porque El  muri&oacute; por m&iacute;, Le seguir&eacute;.<br />\n</p>"}, {"num": 130, "title": "Mi pasión", "html": "Nadie hay como t&uacute;, eres dulce refugio <br />\nA mi ser eres luz, andar&eacute; en tus caminos<br />\nTe necesito a mi lado  por siempre Tu eres todo en m&iacute;. <br />\n&nbsp; <br />\nMi pasi&oacute;n es estar junto a ti <br />\nOh precioso Jesus <br />\nY sentir como llenas mi vida <br />\nde consuelo y aliento. (se repite el  canto) <br />\n&nbsp;<br />\n<br />"}, {"num": 131, "title": "Tu nombre levantaré", "html": "Tu nombre levantar&eacute; <br />\nMe deleito en adorarte <br />\nTe agradezco que en mi vida est&eacute;s <br />\nQue vinieras a salvarme. // <br />\n&nbsp; <br />\nDejaste el trono <br />\nPara mostrarnos la luz <br />\nDe tu trono la cruz <br />\nY mi deuda pagar <br />\nDe la cruz a morir <br />\nDe la muerte a tu trono <br />\nTu nombre yo levantar&eacute;. // <br />\n&nbsp;<br />\n<br />"}, {"num": 132, "title": "Padre Amado", "html": "// Padre amado // <br />\nTe adoramos por ser tus hijos, Padre  amado. <br />\n&nbsp; <br />\nY alzamos nuestras voces en un canto de  loor, <br />\n// Padre amado // <br />\n&nbsp; <br />\n// Jesucristo // <br />\nTe adoramos por redimirnos, Jesucristo, <br />\n&nbsp; <br />\nY alzamos nuestras voces en un canto de  loor, <br />\n// Jesucristo // <br />\n&nbsp; <br />\n// Santo Esp&iacute;ritu // <br />\nTe alabamos por consolarnos, Santo  Esp&iacute;ritu <br />\n&nbsp; </p>\n<p>Y alzamos nuestras voces en un canto de loor,<br />\n  //Santo Esp&iacute;ritu //<br />\n</p>"}, {"num": 133, "title": "Anciano de días", "html": "Bendici&oacute;n y gloria, poder y honra,<br />\nal  Anciano de D&iacute;as ser&aacute;n.<br />\nToda naci&oacute;n y la creaci&oacute;n,<br />\nal Anciano de D&iacute;as se  postrar&aacute;n. <br />\n&nbsp; <br />\nToda  lengua confesar&aacute;, declarar&aacute; Tu gloria. <br />\nToda  rodilla se doblar&aacute; adorando. <br />\nTu nombre exaltado ser&aacute; y tu reino,<br />\nAnciano de D&iacute;as &iexcl;no  pasar&aacute;! // <br />\n&nbsp; <br />\nSobre la Tierra T&uacute; reinar&aacute;s,<br />\nal Anciano  de D&iacute;as cantad. <br />\nTu gran dignidad Dios,<br />\nes sin igual al  Anciano de D&iacute;as cantad. <br />\n&nbsp; </p>"}, {"num": 134, "title": "Este es mi deseo", "html": "</p>\n<p>Este es mi deseo honrarte a t&iacute; con todo  mi ser te adoro<br />\n  a t&iacute; con todas mis fuerzas te alabar&eacute; mi adoraci&oacute;n eres t&uacute;.\n<br />\n  Hoy te rindo mi ser te doy mi coraz&oacute;n yo vivo para ti,<br />\n  en cada  palpitar mientras haya aliento en m&iacute; <br />\n  Dios  has tu obra en m&iacute;. // <br />\n&nbsp; </p>"}, {"num": 135, "title": "Y si vivimos", "html": "</p>\n<p>//Y si vivimos para &Eacute;l vivimos <br />\n  Y  si morimos para &Eacute;l morimos. // <br />\n  &nbsp; <br />\n  Coro <br />\n  Sea que vivamos O que muramos. <br />\n  //  Somos del Se&ntilde;or // X2<br />\n  <br />\n  &nbsp; <br />"}, {"num": 136, "title": "Mi Ser Alaba al Señor", "html": "Mi ser alaba al Se&ntilde;or,<br />\n  y se goza mi  esp&iacute;ritu en Jesucristo.<br />\n  Mi ser alaba al Se&ntilde;or<br />\n  y se goza mi esp&iacute;ritu en Dios. <br />\nPues sus obras son poderosas,<br />\ncon su esp&iacute;ritu el me guiara,<br />\nbondadoso a  sido mi Se&ntilde;or,<br />\ngrande es El Se&ntilde;or, grande es El Se&ntilde;or<br />\n</p>"}, {"num": 137, "title": "Iglesia de Cristo", "html": "</p>\n<p>Con Poder y Autoridad,<br />\n  con gran gloria y  potestad,<br />\n  tu viniste a levantar este reino sin final.<br /> \n  <br />\n  Somos pueblo escogido,<br />\n  somos cuerpo del Se&ntilde;or,<br />\n  somos la  Iglesia de Cristo y<br />\n  queremos serle Fiel. <br />\n  &nbsp; <br />\n  <u>Coro:<br />\n  </u>Y cantamos alabanza al que<br />\n  con sangre  nos compr&oacute;,<br />\n  proclamamos un nuevo pacto<br />\n  en la gracia de la Cruz.<br />\n  Y aqu&iacute; estamos  hoy unidos<br />\n  declarando a una voz:<br />\n  &iexcl;Somos la Iglesia de Cristo,<br />\n  Somos siervos de  Dios!&nbsp; <br />\n&nbsp; </p>"}, {"num": 138, "title": "Este día de vida", "html": "</p>\n<p>Este d&iacute;a de vida que tu,<br />\n  que tu me das Jehov&aacute;//<br />\n  Proclamo tu  grandeza//<br />\n  Y declaro que no hay otro como tu! <br />\n  &nbsp; <br />\n  T&uacute; eres grande. Grande eres tu//<br />\n  Tu eres grande. &iexcl;Grande eres  tu mi Jehov&aacute;! <br />\n  &nbsp; <br />\n  Merecedor de mi alabanza,<br />\n  Merecedor de mi adoraci&oacute;n//<br />\n  Y con mi  canto//<br />\n  Tu nombre yo proclamare! <br />\n&nbsp; </p>"}, {"num": 139, "title": "Cordero de Dios", "html": "</p>\n<p>Santo hijo sin pecado,<br />\n  lo has mandado de  tu lado,<br />\n  para sufrir crucificado y<br />\n  para ser cordero de Dios. <br />\n  &nbsp; <br />\n  <u>Coro:</u>&nbsp; <br />\n  Cordero de Dios//<br />\n  Te amo Santo Cordero de  Dios.<br />\n  Oh l&aacute;vame en tu sangre,<br />\n  Cristo Jes&uacute;s, Cordero de Dios. <br />\n  &nbsp; <br />\n  Tu galard&oacute;n crucificaron,<br />\n  se burlaron y lo mataron.<br />\n  Al humilde  Rey lo defraudaron<br />\n  y al Cordero de Dios mataron. <br />\n  &nbsp; <br />\nYo me perd&iacute; casi mor&iacute;,<br />\nPero me has tra&iacute;do hasta aqu&iacute;.<br />\nPara  seguir en pos de ti,<br />\ny ser tambi&eacute;n Cordero de Dios.<br />\n</p>"}, {"num": 140, "title": "Omnipotente", "html": "&iexcl;Omnipotente, vencedor!<br />\nCastillo fuerte, mi libertador// <br />\n&iexcl;Con tu poder y brazo fuerte me libraste,<br />\nel mar se abri&oacute; el pueblo en seco camino!<br />\nDios de Abraham, Dios de Isaac, Dios  de Jacob.<br />\n&iexcl;Yo soy tu hijo declar&aacute;ndote Se&ntilde;or! <br />\n&nbsp; <br />\n&iexcl;Omnipotente, vencedor!<br />\nCastillo fuerte, mi libertador// <br />\n&iexcl;Con tu poder, los muros derribaste,<br />\nEl&iacute;as or&oacute; fuego del cielo descendi&oacute;!<br />\nDios de Abraham, Dios de Isaac,<br />\nDios de  Jacob.<br />\n&iexcl;Yo soy tu hijo declar&aacute;ndote Se&ntilde;or!&nbsp; <br />\n&nbsp; <br />\n&iexcl;&iexcl;Omnipotente!! <br />\n&nbsp; </p>"}, {"num": 141, "title": "Aunque otros canten", "html": "</p>\n<p>Aunque otros canten para otros dioses,<br />\n  hechos de metal de madera o de bronce.<br />\n  Yo alabare el nombre de Jehov&aacute;.<br />\n  El  nombre de Jehov&aacute; alabare. <br />\n  &nbsp; <br />\n  Porque soy un sacerdote<br />\n  llamado a ministrar en su presencia<br />\n  y  ahora alabare el Santo Nombre<br />\n  Bendito de Jehov&aacute;. <br />\n&nbsp; </p>"}, {"num": 142, "title": "Abre mis ojos", "html": "</p>\n<p>Abre  mis ojos oh Cristo,<br />\n  Abre mis ojos Se&ntilde;or. <br />\n  Yo  quiero verte, yo quiero verte// <br />\n  &nbsp; <br />\n  Y contemplar tu majestad,<br />\n  y el resplandor de tu gloria,<br />\n  derrama tu amor y poder, cuanto <br />\n  cantamos santo santo!// Santo//////<br />\n  &iexcl;Yo quiero verte! <br />\n  &nbsp; <br />"}, {"num": 143, "title": "Grande es Jehová", "html": "Grande es Jehov&aacute; y digno de ser alabado.<br />\n  En la ciudad de  nuestro Dios,<br />\n  en su monte es Santo.<br />\n  Hermosa provincia, el gozo de toda la  tierra!&nbsp; <br />\n  &nbsp; <br />\nEs en el monte de Sion a los lados<br />\ndel  norte de la Ciudad del gran Rey//<br />\n</p>"}, {"num": 144, "title": "Grandes y Maravillosas son tus Obras", "html": "Grandes y maravillosas son tus obras,<br />\nSe&ntilde;or Dios todopoderoso.<br />\nJustos y Verdaderos son tus caminos.&nbsp; <br />\nRey  de los Santos/// <br />\nAleluya  Amen//// Amen Amen! <br />\n&nbsp; <br />\n&iquest;Quien no te temer&aacute; oh Se&ntilde;or?<br />\nY  glorificar&aacute; tu nombre,<br />\npues solo tu eres Santo,<br />\npor lo cual todas las naciones  vendr&aacute;n.&nbsp; <br />\nY  te adoraran// <br />\nAleluya  Amen//// Amen Amen! <br />\n</p>\n<p>  <br />"}, {"num": 145, "title": "Dad Gracias", "html": "Dad  Gracias, de todo coraz&oacute;n.<br />\n  Dad Gracias al \n  Dios  alt&iacute;simo,<br />\n  Dad Gracias porque a su hijo <br />\n  Jesucristo  nos dio// <br />\n  &nbsp; <br />\n  Y  ahora diga el d&eacute;bil:\n  Fuerte soy! <br />\n  Diga  el pobre: Rico soy! <br />\n  Por lo que ha hecho el Se&ntilde;or<br />\n  por m&iacute;.//  Dad Gracias. <br />\n  &nbsp; </p>"}, {"num": 146, "title": "Espíritu Santo", "html": "</p>\n<p>Esp&iacute;ritu Santo yo te necesito.<br />\n  Manda tu  fuego a este lugar.<br />\n  Esp&iacute;ritu Santo solo anhelo mirar<br />\n  tu Gloria y Majestad. <br />\n  T&uacute; eres mi fuerza, t&uacute; eres mi ayuda.<br />\n  Esp&iacute;ritu Santo, ven a  este lugar!// <br />\n  Esp&iacute;ritu  Santo ven a este lugar. <br />\n&nbsp; </p>"}, {"num": 147, "title": "Mas el Dios de toda gracia", "html": "&nbsp; <br />\n  M&aacute;s  el Dios de toda gracia <br />\n  Que  nos llam&oacute; a su gloria eterna <br />\n  Os  perfeccione y afirme, <br />\n  Fortalezca  y establ
