ezca, <br />\n  &nbsp; <br />\n  Coro <br />\n  A  &Eacute;l sea la gloria,<br />\n  A &Eacute;l sea el imperio, <br />\n  Por  los siglos de los siglos. //  &nbsp; <br />\nAm&eacute;n  /// Y am&eacute;n. <br />\n</p>"}, {"num": 148, "title": "Padre (Dos voces)", "html": "Padre// mu&eacute;strame// de tu gracia//<br />\nel poder// solo tu// puedes  dar//<br />\nA mi alma el consuelo y la paz. <br />\n&nbsp; <br />\n<u>Coro:<br />\n</u>Quiero darte mi loor,<br />\npor tu grandeza  inmensurable.<br />\nY por la eternidad<br />\ncantar de tu (infinito) amor. <br />\n&nbsp; <br />\nPadre// ll&eacute;vame// de tu mano//<br />\npara entrar// con tu luz//  gu&iacute;ame// <br />\nA  trav&eacute;s de las tinieblas y maldad. <br />\n&nbsp; </p>"}, {"num": 149, "title": "Oh Moradoras", "html": "</p>\n<p>Oh moradoras de Sion\n  alaba a Jehov&aacute;!<br />\n  Grandes son sus  maravillas! // <br />\n  Sobre  los montes y collados a mi amado buscare,<br />\n  grande es su hermosura y al estar su  presencia<br />\n  con gozo alabare. Al Se&ntilde;or alabare!// <br />\n  &nbsp; <br />\n  <u>Coro:<br />\n  </u>Grande es Jehov&aacute;, digno de alabar!//<br />\n  Tu  eres grande Jehov&aacute;, grande es tu nombre/// <br />\n&nbsp; </p>"}, {"num": 150, "title": "Mi ser esta en ti", "html": "</p>\n<p>Mi  ser, est&aacute; en ti Dios!<br />\n  &iexcl;Mi amor, est&aacute; en ti Dios!<br />\n  Mi fe, esta en ti Dios,<br />\n  en ti, solo en ti!// <br />\n  &nbsp; <br />\n  Te alabo con todo m&iacute; ser,<br />\n  te alabo con todo mi amor.<br />\n  Con todo  mi ser,<br />\n  con todo mi amor,<br />\n  toda mi fe esta en ti! <br />\n&nbsp; </p>"}, {"num": 151, "title": "Él es el Rey!", "html": "</p>\n<p>&Eacute;l es el rey infinito en poder,<br />\n  &eacute;l es el  rey de los cielos.<br />\n  Ser&eacute; para el siervo fiel<br />\n  pues mi vida compro con su amor. <br />\n  &Eacute;l es el rey lo confiesa mi ser,<br />\n  &eacute;l es el rey de los siglos,<br />\n  mi vida la rindo a sus pies,<br />\n  &eacute;l es rey sobre mi coraz&oacute;n. <br />\n  <br />\n  <u>Coro:<br />\n  </u>El es el rey//<br />\n  El es el rey de mi vida.<br />\n  &Eacute;l es el rey//<br />\n  reina con autoridad<br />\n  <br /> \n  Su reino eterno es,<br />\n  su trono el cielo es,<br />\n  &Eacute;l  es el rey que viene<br />\n  a su pueblo a llevar.<br />\n</p>"}, {"num": 152, "title": "Vengo a ti Señor", "html": "</p>\n<p>Gracias  Se&ntilde;or, por el d&iacute;a tan lindo de hoy. <br />\n  Gracias  Se&ntilde;or por la vida y la salud. // <br />\n  Vengo, vengo a ti//<br />\n  Vengo a ti Se&ntilde;or<br />\n  a mostrar mi gratitud. <br />\n  &nbsp; </p>"}, {"num": 153, "title": "Alzare mis ojos (Salmo 121)", "html": "Alzare mis  ojos a los montes;<br />\n&iquest;De donde vendr&aacute; mi socorro?<br />\nMi socorro viene de Jehov&aacute;,<br />\nque  hizo los cielos y la tierra. </p>\n<p>No dar&aacute; tu pie al resbaladero,<br />\n  ni se  dormir&aacute; el que te guarda.<br />\n  He aqu&iacute; no se adormecer&aacute;<br />\n  ni dormir&aacute; el que guarda a  Israel. <br />\n  &nbsp; <br />\n  Jehov&aacute; es tu guardador,<br />\n  Jehov&aacute; es tu sombra tu mano derecha.<br />\n  El sol no te fatigara de d&iacute;a ni la luna de noche.<br />\n  Jehov&aacute; te guardara del mal,<br />\n  Jehov&aacute; guardara tu alma.&nbsp; <br />\n  //Jehov&aacute; guardara tu salida y tu entrada<br />\n  desde ahora y para siempre aleluya.// <br />\n&nbsp; </p>"}, {"num": 154, "title": "Jehová es mi luz (Salmo 27:1)", "html": "Jehov&aacute; es  mi luz y mi salvaci&oacute;n<br />\n&iquest;de quien temer&eacute;? //<br />\nJehov&aacute; es la fortaleza de mi vida,<br />\n&iquest;de  quien he de atemorizarme? // <br />\n&nbsp; </p>"}, {"num": 155, "title": "Espíritu de Dios", "html": "</p>\n<p>Esp&iacute;ritu de Dios,\n  llena mi vida,<br />\n  llena mi alma, llena mi ser.//<br />\n  Y ll&eacute;name, ll&eacute;name, ll&eacute;name<br />\n  con tu presencia ll&eacute;name, ll&eacute;name.<br />\n  Con tu poder  ll&eacute;name, ll&eacute;name<br />\n  con tu amor// <br />\n&nbsp; </p>"}, {"num": 156, "title": "Canta Aleluya", "html": "</p>\n<p>Canta  Aleluya /// A nuestro Dios. X2 <br />\n  Canta fuerte a Dios, todos juntos.<br />\n  Siempre a una voz, Aleluya.<br />\n  Canta fuerte a Dios, que se oiga tu adoraci&oacute;n. <br />\n  &nbsp; <br />\n  Canta  Aleluya /// A nuestro Dios. X2 <br />\n  Desde  el norte hasta el sur // <br />\n  Del  principio al final // <br />\n  &iexcl;Que  se oiga la creaci&oacute;n cantar!&nbsp; X2 <br />\n  &nbsp; <br />\n  Canta  Aleluya /// A nuestro Dios. X2 </p>\n<p>Canta Aleluya/// Canta Aleluya a nuestro Dios.<br />\n</p>"}, {"num": 157, "title": "La ley de Jehová (Salmo 19:7-10)", "html": "La ley  de Jehov&aacute; es perfecta,<br />\nque convierte al alma;<br />\nEl testimonio de Jehov&aacute; es fiel,<br />\nque hace sabio al sencillo. </p>\n<p>&nbsp; <br />\n    <u>Coro:<br />\n  </u>Deseables son mas que el oro,<br />\n  y mas que  mucho oro afinado;<br />\n  Y dulces mas que la miel<br />\n  la que destila del panal. <br />\n  &nbsp; <br />\n  Los mandamientos de Jehov&aacute; son rectos,  <br />\n  q\n  ue alegran el coraz&oacute;n;<br />\n  El precepto de Jehov&aacute; es puro,<br />\n  que alumbra los ojos. <br />\n  &nbsp; <br />\n  El temor de Jehov&aacute; es limpio,<br />\n  que permanece para siempre;<br />\n  Los  juicios de Jehov&aacute; son verdad,<br />\n  son todos justos. <br />\n  &nbsp; </p>"}, {"num": 158, "title": "Eres el Todopoderoso", "html": "</p>\n<p>Eres el Todopoderoso.<br />\n  Se&ntilde;or de mi vida,<br />\n  Dios del cielo y de la tierra.<br />\n  Creador del universo<br />\n  el principio y fin y<br />\n  el  gran Yo Soy eres tu! <br />\n  &nbsp; <br />\n  Eres Se&ntilde;or de se&ntilde;ores.<br />\n  El que era y el que es<br />\n  y el que habr&aacute;  de venir.<br />\n  Bendito sea tu nombre<br />\n  yo te canto a ti<br />\n  tu reinas hoy con poder! <br />\n  &nbsp; <br />\n  <u>Coro:<br />\n  </u>Por siempre eres Dios,<br />\n  por siempre  quiero alabarte.<br />\n  Por siempre eres Dios,<br />\n  por siempre quiero adorarte. <br />\n  Cuando estaba yo tinieblas,<br />\n  t&uacute; me trajiste a la luz<br /> \n  Cuando estaba yo enfermo,<br />\n  t&uacute; me diste  sanidad.<br />\n  Cuando estaba yo perdido,<br />\n  t&uacute; me diste nueva vida.&nbsp; <br />\n  Yo  te entrego hoy, mi coraz&oacute;n//<br />\n</p>"}, {"num": 159, "title": "Agnus dei (Cordero de Dios)", "html": "</p>\n<p>&iexcl;Aleluya, Aleluya! <br />\n  &iexcl;Nuestro  Dios poderoso es Rey! <br />\n  &iexcl;Aleluya,  Aleluya! <br />\n  &nbsp; <br />\n  &iexcl;Santo,  Santo!<br />\n  El Se&ntilde;or Dios poderoso. <br />\n  &iexcl;Digno  eres t&uacute;, Digno eres t&uacute;! <br />\n  &iexcl;Eres  Santo, Santo! </p>\n<p>El Se&ntilde;or Dios poderoso.<br />\n  Digno eres t&uacute;, Digno eres t&uacute;. Amen.<br />\n</p>"}, {"num": 160, "title": "Salmo 3 y 27", "html": "Aunque un ej&eacute;rcito ataque contra mi,<br />\nno temer&eacute;. Aunque haya  guerra hoy<br />\nalrededor de mi, en ti confiar&eacute;! <br />\nNo temer&eacute; a diez mil gentes,<br />\nque hagan sitio contra m&iacute;.<br />\nAunque  la tierra se estremezca<br />\nmi salvaci&oacute;n est&aacute; en ti!&nbsp; <br />\n&nbsp; <br />\n<u>Coro:<br />\n</u>Porque T&uacute; eres mi escudo,<br />\nT&uacute; mi  fortaleza.<br />\nT&uacute; eres mi gloria,<br />\nquien  levanta mi cabeza! <br />\n&nbsp; <br />\nAunque afligido est&eacute;,<br />\nt&uacute; pensar&aacute;s en mi, no temer&eacute;.<br />\nAunque mi  coraz&oacute;n estremecido<br />\nest&eacute;, en ti confiar&eacute;. <br />\nNo temer&eacute; a ning&uacute;n hombre,<br />\nque se junte contra mi.<br />\nT&uacute; eres mi  Dios, mi fortaleza.<br />\nMi salvaci&oacute;n esta en ti!<br />\n</p>"}, {"num": 161, "title": "Amor tan grande", "html": "Amor tan grande, profundo y sublime;<br />\n  es el amor de mi creador. <br />\n  No hay en el mundo que pueda<br />\n  igualarse al tierno amor de mi  buen Jes&uacute;s. <br />\n  &nbsp; <br />\n  <u>Coro:</u><br />\n  Dios de amor, oh Dios de amor!<br />\n  Solo eres  tu el Dios de amor.<br />\n  No hay otro Dios, no lo hay.<br />\n  Fuera de ti, no lo hay.<br />\n  Fuera  de ti para m&iacute; no hay amor. <br />\n  &nbsp; <br />\n  El solo nos ama, nos comprende<br />\n  y nos  guarda de todos los males que existen aqu&iacute;. <br />\n  Por eso le adoro con toda mi alma<br />\n  porque me has dado mi Jes&uacute;s  dulce calma. <br />\n</p>\n<p>  <br />"}, {"num": 162, "title": "Cordero", "html": "Cordero que bajaste del cielo,<br />\n  a morir en la cruz para darme  salud<br />\n  y tambi&eacute;n salvaci&oacute;n.<br />\n  Vertiste tu sangre inmaculada,<br />\n  con la cual mi maldad  al morir<br />\n  en la cruz la borraste de m&iacute;. <br />\n  &nbsp; <br />\n  T&uacute; me diste la vida, salvaste mi coraz&oacute;n.<br />\n  T&uacute; me diste la paz  que reina en mi coraz&oacute;n // <br />\n  Porque, porque tu eres mi Dios.<br />\n  Porque tu eres mi Dios y mi  buen salvador&hellip; </p>\n<p>///Y moriste por mi///<br />\n</p>"}, {"num": 163, "title": "Enaltecido tu eres", "html": "</p>\n<p>Enaltecido tu eres, oh Dios.<br />\n  Mas exaltado que los dioses oh  Se&ntilde;or//<br />\n   Te  exaltamos/// Oh Se&ntilde;or! // <br />\n&nbsp; </p>"}, {"num": 164, "title": "Tu Iglesia", "html": "</p>\n<p>Desde antes de la fundaci&oacute;n del mundo y la creaci&oacute;n,<br />\n  exist&iacute;a  en la mente de Dios un plan.<br />\n  Establecer un Reino sin igual, con gloria y  majestad,<br />\n  mando a su hijo Jesucristo. <br />\n  &nbsp; <br />\n  <u>Coro:<br />\n  </u>Gracias Dios por salvarnos,<br />\n  por tu  gracia y tu bondad.<br />\n  Gracias Dios por tu hijo<br />\n  que nos vino a rescatar.<br />\n  Hoy tu  iglesia te canta,<br />\n  damos loor a ti porque t&uacute; eres digno. <br />\n  &nbsp; <br />\n  El pueblo de Dios, un real sacerdocio,<br />\n  as&iacute; describes tu a la Iglesia.<br />\n  Un reino con poder, con un se&ntilde;or y rey,<br />\n  que  alabamos hoy, Jesucristo. <br />\n&nbsp; </p>"}, {"num": 165, "title": "Mi cuerpo doy", "html": "</p>\n<p>Confi&oacute; en ti a cada paso,<br />\n  en d&iacute;as de calma o de ansiedad.<br />\n  T&uacute;  eres fiel a tus promesas,<br />\n  mi roca fuerte me entrego a ti. <br />\n  &nbsp; <br />\n  <u>Coro:<br />\n  </u>Mi cuerpo doy en sacrificio<br />\n  vivo y santo  aceptable a ti.<br />\n  Cambiado fui, no soy el mismo,<br />\n  fui transformado por tu gracia  sin fin. <br />\n  &nbsp; <br />\n  Hoy veo en m&iacute; la misericordia<br />\n  que ha renovado a mi pensar,<br />\n  vive en mi, dame tu aliento<br />\n  para encontrarte en la eternidad.<br />\n&nbsp; </p>"}, {"num": 166, "title": "Oh Dios, tu eres mi Dios Oh", "html": "Dios tu eres  mi Dios y siempre te alabare// &nbsp; <br />\n  Yo te busco en la ma&ntilde;ana,<br />\n  aprender&eacute; a  andar en tus modos.<br />\n  Y te sigo en tus pasos, te seguir&eacute; con todo m&iacute; ser. <br />\n  &nbsp; <br />\n<u>Final:<br />\n</u>Y te sigo en tus pasos, te seguir&eacute; con todo mi ser.<br />\n</p>"}, {"num": 167, "title": "Te alabaran oh Jehová", "html": "</p>\n<p>Te  alabar&aacute;n oh Jehov&aacute; todos los reyes.<br />\n  Todos los reyes de la tierra.<br />\n  Porque han  o&iacute;do los dichos de tu boca,<br />\n  y cantar&aacute;n de los caminos de Jehov&aacute;. <br />\n  &nbsp; <br />\n  Porque  la gloria de Jehov&aacute; es grande,<br />\n  porque \n  Jehov&aacute;  es excelso en sus caminos,<br />\n  porque Jehov&aacute; atiende al humilde<br />\n  mas mira de lejos  al altivo.&nbsp; // <br />\n&nbsp; </p>"}, {"num": 168, "title": "Herencia Espiritual", "html": "</p>\n<p>P&iacute;danme y les dar&eacute; naciones,<br />\n  como herencia espiritual,<br />\n  como  herencia espiritual mis hijos// <br />\n  &nbsp; <br />\n  &iexcl;Heme aqu&iacute;, env&iacute;ame a las naciones!<br />\n  Embajador tuyo ser&eacute;,<br />\n  embajador tuyo ser&eacute; mi padre// <br />\n&nbsp; </p>"}, {"num": 169, "title": "Lávame en tu sangre", "html": "</p>\n<p>L&aacute;vame en tu sangre, <br />\n  l&aacute;vame en tu sangre carmes&iacute; //&nbsp; <br />\n  Con ella compraste,<br />\n  con ella pagaste t&uacute; por m&iacute;.<br />\n  L&aacute;vame en tu  sangre,<br />\n  l&aacute;vame en tu sangre,<br />\n  l&aacute;vame en tu sangre Se&ntilde;or// <br />\n&nbsp; </p>"}, {"num": 170, "title": "Haz mi carácter", "html": "</p>\n<p>Jes&uacute;s, haz mi car&aacute;cter<br />\n  m&aacute;s como el tuyo, yo quiero ser. // <br />\n  &nbsp; <br />\n  Porque en esta vida hay cosas que pasan<br />\n  que yo no entiendo.<br />\n  Porque yo quiero reflejar tu amor<br />\n  a cada instante. <br />\n  Hazme hacer tu voluntad<br />\n  y morir a mi  viejo hombre.  &nbsp; <br />\n  Haz mi car&aacute;cter m&aacute;s como el tuyo,<br />\n  yo quiero ser. // <br />\n&nbsp; </p>"}, {"num": 171, "title": "De gloria en gloria", "html": "</p>\n<p>De gloria en gloria te veo,<br />\n  cuanto m&aacute;s te  conozco,<br />\n  quiero saber m&aacute;s de ti.<br />\n  Mi Dios cual buen alfarero,<br />\n  quebrante,  transf&oacute;rmame;<br />\n  renu&eacute;vame a tu imagen, Se&ntilde;or.</p>\n<p>&iexcl;Quiero ser m&aacute;s como t&uacute;!<br />\n  &iexcl;Ver la vida como t&uacute;!<br />\n  Saturarme de tu Esp&iacute;ritu,<br />\n  y reflejar al mundo tu amor.<br />\n</p>"}, {"num": 172, "title": "Hosanna a Cristo nuestro Rey", "html": "Hosanna  a Cristo nuestro Rey // <br />\nEl  le&oacute;n de la tribu de Jud&aacute; // <br />\nHosanna  a Cristo nuestro Rey // <br />\nRegocijo  y j&uacute;bilo ante &Eacute;l // <br />\n&nbsp; <br />\nCORO <br />\n//  Hosanna, gloria,&nbsp; <br />\nhonores  a nuestro Rey // <br />\n&nbsp; <br />\nHosanna  a Cristo nuestro Rey // <br />\nLe  traemos ofrendas de amor // <br />\nHosanna  a Cristo nuestro Rey // <br />\n&Eacute;l  es Dios ha vencido y vencer&aacute; //<br />\n<br />\n&nbsp; <br />"}, {"num": 173, "title": "Porque él vive", "html": "Dios  nos envi&oacute; a su hijo Cristo <br />\nEl  es amor paz y perd&oacute;n <br />\nPor  m&iacute; muri&oacute; en el calvario <br />\nM&aacute;s  de la tumba con poder resucit&oacute; <br />\n&nbsp; <br />\nCORO <br />\nPorque  El vive, no temo el ma&ntilde;ana <br />\nPorque &eacute;l vive, seguro estoy,<br />\nPorque yo  s&eacute;, yo se que&nbsp; el futuro es suyo, <br />\nY  que la vida vale, porque El vive hoy. <br />\n&nbsp; <br />\nSe  acabar&aacute; mi vida un d&iacute;a,&nbsp; <br />\nEnfrentare  muerte y dolor&nbsp; <br />\nM&aacute;s a Jes&uacute;s ver&eacute; en la gloria&nbsp;  &nbsp;&nbsp;&nbsp;&nbsp; &nbsp; <br />\nY  reinare con mi triunfante Salvador&nbsp;<br />\n<br />\n&nbsp; <br />"}, {"num": 174, "title": "La batalla es de nuestro Señor", "html": "Con celestial armadura en la tierra  entrar&eacute;<br />\nLa batalla es de nuestro Se&ntilde;or, <br />\nY no hay armamento que nos pueda herir,<br />\nLa batalla es de nuestro Se&ntilde;or.<br />\n&nbsp; <br />\nCORO <br />\nY cantamos gloria a Dios.<br />\nFuerza y honor  al Se&ntilde;or.<br />\nY cantamos con poder,<br />\nfuerza y honor al Se&ntilde;or // <br />\n&nbsp; </p>\n<p>Y al venir la corriente de tanta maldad<br />\n  La batalla es de nuestro Se&ntilde;or,<br />\n  El poder de su  sangre es modelo de amor<br />\n  La batalla es de nuestro Se&ntilde;or.<br />\n</p>"}, {"num": 175, "title": "Entraré por sus puertas", "html": "</p>\n<p>Entrar&eacute; por sus puertas con cantos de  loor,<br />\n  por sus atrios con alabanza.<br />\n  Y dir&eacute; este es el d&iacute;a que hizo el Se&ntilde;or,<br />\n  me  gozar&eacute; y alegrar&eacute; en &eacute;l. <br />\n  &nbsp; <br />\n  CORO <br />\n  Yo  le alabar&eacute;, yo le alabar&eacute;,&nbsp; <br />\n  Me  gozar&eacute; y alegrar&eacute; en &eacute;l. // <br />\n&nbsp; </p>"}, {"num": 176, "title": "Bueno es Dios", "html": "</p>\n<p>Bueno  es Dios, siempre fiel <br />\n  Puso  un canto nuevo en mi coraz&oacute;n <br />\n  Bueno  es Dios, siempre fiel <br />\n  En  la oscuridad brillar&aacute; su amor <br />\n  &nbsp; <br />\n  //Bueno  es Dios// Siempre fiel. <br />\n  &nbsp; <br />\n  Si  t&uacute; vas por el valle <br />\n  Y  hay sombras alrededor <br />\n  Dile  adi&oacute;s al temor <br />\n  Pues  Jes&uacute;s contigo est&aacute; <br />\n  Prometi&oacute;  nunca dejarte <br />\n  Ni  abandonarte y &Eacute;l no mentir&aacute;. <br />\n  &nbsp; <br />\n  Bueno  es Dios, siempre fiel <br />\n  Puso  un canto nuevo en mi coraz&oacute;n <br />\n  Bueno  es Dios, siempre fiel <br />\n  En  la oscuridad brillar&aacute; su amor <br />\n  &nbsp; <br />\n  //Bueno  es Dios// Siempre fiel.<br />\n  <br />\n  &nbsp; <br />"}, {"num": 177, "title": "No hay lugar más alto", "html": "A tus pies arde mi coraz&oacute;n <br />\n  A tus pies entrego lo que soy<br />\n  Es el lugar de mi  seguridad <br />\n  Donde nadie me puede se&ntilde;alar. <br />\n  &nbsp; <br />\n  Me perdonaste,<br />\n  me acercaste a tu presencia.<br />\n  Me  levantaste,<br />\n  y hoy me postro a adorar. <br />\n  &nbsp; <br />\n  // No hay lugar m&aacute;s alto <br />\n  M&aacute;s grande <br />\n  Que estar a tus pies<br />\n  Que estar a tus pies //<br />\n</p>"}, {"num": 178, "title": "Hay libertad", "html": "</p>\n<p>Donde est&aacute; el Esp&iacute;ritu de Dios,<br />\n  Hay Libertad, hay Libertad.<br />\n  Donde est&aacute; el Esp&iacute;ritu de Dios,<br />\n  All&iacute; siempre hay libertad. <br />\n  &nbsp; <br />\n  &iexcl;Libertad,  Libertad,<br />\n  Libertad, Libertad! \n  <br />\n  Donde est&aacute; el Esp&iacute;ritu de Dios,<br />\n  All&iacute;  siempre hay libertad. <br />\n&nbsp; </p>"}, {"num": 179, "title": "La más linda canción", "html": "Quiero cantar //<br />\nLa  m&aacute;s linda canci&oacute;n // <br />\n  Que  jam&aacute;s hombre alguno // <br />\n  Un  d&iacute;a escribi&oacute; // X2 <br />\n  &nbsp; <br />\n  Coro <br />\n  Decir  que Jes&uacute;s es la vida<br />\n  y me dio salud. <br />\n  Decir  que Jes&uacute;s es la vida<br />\n  y me dio la paz.<br />\n  &Eacute;l es el autor de la vida.<br />\n  Me salva, me  guarda y me cuida.<br />\n  As&iacute; es en mi vida el Se&ntilde;or Jes&uacute;s.&nbsp; <br />\n&nbsp; </p>"}, {"num": 180, "title": "Tu mano me sostiene", "html": "</p>\n<p>// Tu mano me sostiene,<br />\n  tu Esp&iacute;ritu me alienta<br />\n  y siempre en  victoria t&uacute; me llevar&aacute;s // <br />\n  &nbsp; <br />\n  Vivo solo para Cristo y nadie m&aacute;s,<br />\n  Solo  en Jes&uacute;s, encontr&eacute; la Paz. <br />\n  El  me llena de su Esp&iacute;ritu de Amor, <br />\n  Siempre  cantar&eacute;, soy m&aacute;s que vencedor. <br />\n&nbsp; </p>"}, {"num": 181, "title": "Salvador Maravilloso", "html": "</p>\n<p>Salvador maravilloso, <br />\n  amigo y redentor.<br />\n  &iquest;Como creer que un  cordero<br />\n  pudiera salvarme a m&iacute;?<br />\n  Oh, pudiera salvarme a m&iacute;. <br />\n  &nbsp; <br />\n  Coro <br />\n  Tu  eres santo Se&ntilde;or <br />\n  Digno  de nuestro loor <br />\n  Tu  sanas y das la gracia <br />\n  A  nuestro coraz&oacute;n. Oh, a nuestro coraz&oacute;n.&nbsp; <br />\n  &nbsp; <br />\nConsolador t&uacute; me cuidas,<br />\ntu Esp&iacute;ritu me  llenar&aacute;.<br />\nT&uacute; me das la esperanza<br />\ncuando perdido estoy.<br />\nOh, cuando perdido estoy.<br />\n<br />\n<br />"}, {"num": 182, "title": "Sublime gracia", "html": "Sublime  gracia del Se&ntilde;or&nbsp; <br />\nQue  un infeliz salv&oacute;; <br />\nFui ciego mas hoy miro yo,<br />  \nPerdido y &eacute;l me hall&oacute;. <br />\n&nbsp; <br />\nSu  gracia me ense&ntilde;&oacute; a temer;&nbsp; <br />\nMis  dudas ahuyent&oacute;; <br />\n&iexcl;Oh cu&aacute;n precioso fue a mi se<br /> \nCuando &Eacute;l me transform&oacute;. <br />\n&nbsp; <br />\nEn  los peligros o aflicci&oacute;n&nbsp; <br />\nQue yo he tenido aqu&iacute;,<br />\nSu gracia siempre  me libr&oacute;,<br />\nY me guiar&aacute; feliz. <br />\n&nbsp; <br />\nY  cuando en Sion por siglos mil&nbsp; <br />\nBrillando  como el sol, <br />\nA  Dios por siempre alabar&eacute;: <br />\n&iexcl;Su  gracia me salv&oacute;! <br />\n&nbsp; </p>"}, {"num": 183, "title": "Me gusta estar en tu casa", "html": "// Me gusta  estar en tu casa,<br />\nCelebrando con tu pueblo.<br />\nMe  gusta darte honor, <br />\n  Con  mis labios y mi voz. // <br />\n  &nbsp; <br />\n  Coro <br />\n  Mi  voz haces cantar, <br />\n  Mi  coraz&oacute;n gozar, <br />\n  Me  das raz&oacute;n para gozar. &iexcl;Gozar! <br />\n  &nbsp; <br />\n  Me gusta estar en tu casa<br />\n  celebrando con tu pueblo.<br />\n  Me gusta  darte honor,<br />\n  con mis labios y mi voz.<br />\n  <br />\n  /// Con mis labios /// y mi voz. X2 <br />\n&nbsp; </p>"}, {"num": 184, "title": "Creo en ti", "html": "</p>\n<p>Quiero levantar a ti mis manos,<br />\n  maravilloso Jes&uacute;s, milagroso  Se&ntilde;or.<br />\n  Llena este lugar de tu presencia<br />\n  y haz descender tu poder a los que  estamos aqu&iacute;.&nbsp;<br />\n  <br />\n  //  Creo en ti Jes&uacute;s y<br />\n  en lo que har&aacute;s en m&iacute; // <br />\n  //  En mi//<br />\n  // Recibe toda la gloria,<br />\n  recibe toda la honra,<br />\n  precioso hijo de Dios.  //<br />\n</p>"}, {"num": 185, "title": "Nos reunimos para alabarte", "html": "Nos  reunimos para adorarte, <br />\nHemos venido a exaltarte,<br />\nNuestras voces levantamos,<br />\nProclamando tu nombre.&nbsp; <br />\n&nbsp; <br />\nNos  reunimos para adorarte, <br />\nHemos venido a exaltarte,<br />\nNuestras voces  levantamos,<br />\nY tu pueblo canta hoy. <br />\n&nbsp; <br />\nCORO <br />\n//// Ex&aacute;ltate Se&ntilde;or ////<br />\nToda la gloria,  toda la honra.&nbsp; <br />\nY  la alabanza sean a ti. <br />\n&nbsp; </p>"}, {"num": 186, "title": "Te agradezco", "html": "</p>\n<p>Por lo que t&uacute; has hecho agradezco,<br />\n  por todo lo que vas a  hacer.<br />\n  Lo que t&uacute; eres en tu gran bondad<br />\n  es lo que me ha hecho vivir.&nbsp;&nbsp; <br />\n  Cristo  doy gracias. <br />\n  //&iexcl;Y doy gracias, gracias Dios!//&nbsp; <br />\n  &nbsp; <br />\n  Gracias por amarme<br />\n  y librarme del mal.<br />\n  Por dar tu vida tan solo por m&iacute;,<br />\n  te agradezco oh Dios.<br />\n  Yo te agradezco Dios.<br />\n  Te  doy las gracias. &iexcl;Gracias! <br />\n&nbsp; </p>"}, {"num": 187, "title": "Pusiste un canto en mi alma", "html": "</p>\n<p>  Pusiste un canto en mi alma y lo tengo que cantar,<br />\n  tu esp&iacute;ritu  en mi vida me hace proclamar.<br />\n  En mi coraz&oacute;n te quiero alabar,<br />\n  pusiste un canto  en mi alma al hacerme.&nbsp; <br />\n  &nbsp; <br />\n  Seguir&eacute; cantando hasta cuando morir&eacute;,<br />\n  porque prometiste que en el cielo morar&eacute;<br />\n  el gozo de mi espiritu canta en tu nombre,<br />\n  pusiste un canto en mi  alma al hacerme.</p>\n<p>//  Canta mi alma&hellip;En tu nombre alabar&eacute;<br />\nCanta  mi alma&hellip;y tu nombre yo honrar&eacute;<br />\nCanta  mi alma&hellip;mi vida te dedicar&eacute;<br />\nCanta  mi alma&hellip; //<br />\n  &nbsp; </p>"}, {"num": 188, "title": "Al que me ciñe de poder", "html": "</p>\n<p>Al que me ci&ntilde;e de poder //<br />\n  Aquel que mi  victoria es //<br />\n  S&oacute;lo a &Eacute;l alabar&eacute; //<br />\n  S&oacute;lo a &Eacute;l exaltar&eacute; // <br />\n//  De ti ser&aacute; mi alabanza<br />\nen la congregaci&oacute;n.<br />\nCantar&eacute; y alabar&eacute;,<br />\ntu nombre Se&ntilde;or //<br />\n</p>"}, {"num": 189, "title": "Quebrántame", "html": "Quebr&aacute;ntame,  Se&ntilde;or <br />\nTransforma  mi coraz&oacute;n&nbsp; <br />\nMu&eacute;strame  tu voluntad <br />\nPorque  confieso que&hellip; <br />\n&nbsp; <br />\nCoro&nbsp; <br />\nMi  coraz&oacute;n duro es Se&ntilde;or&nbsp; <br />\nMi pecado me destruy&oacute;<br />\nTe pido Dios, por  favor<br />\nQuebr&aacute;ntame, Se&ntilde;or. <br />\n&nbsp; <br />\nS&eacute;  que he fallado, Se&ntilde;or <br />\nMas puedo ver tu amor<br />\nEns&eacute;&ntilde;ame como  crecer<br />\nQuebr&aacute;ntame oh Dios.<br />\n</p>"}, {"num": 190, "title": "Heme aquí", "html": "// Heme aqu&iacute; yo ir&eacute; Se&ntilde;or //<br />\n  Env&iacute;ame a m&iacute;  que dispuesto estoy. <br />\n  Y  llevar&eacute; tu gloria a las naciones.<br />\n</p>"}, {"num": 191, "title": "Cristo, rey victorioso", "html": "Cristo  Rey victorioso, <br />\n  Te  adoramos bendito Se&ntilde;or. <br />\n  Te has coronado sobre todo nombre,<br />\n  Cristo, Rey, Se&ntilde;or. <br />\n</p>"}, {"num": 192, "title": "Cristo, eres bello", "html": "Cristo // eres // bello  // <br />\n  Hermoso sin igual eres T&uacute;  Se&ntilde;or.  &nbsp; <br />\n  Yo te // adorare //  siempre // <br />\n  En tu presencia quiero  estar Se&ntilde;or,<br />\n  junto a ti. <br />\n  &nbsp; <br />\n  Coro <br />\n  Y cuando est&eacute; en problemas,<br />\n  Y cuando est&eacute; en aflicci&oacute;n. <br />\n  Me acordar&eacute; que T&uacute; est&aacute;s  conmigo, <br />\n  Y siempre podr&eacute; decirte&hellip; <br />\n  &nbsp; <br />\n  Cristo // eres // bello  // <br />\n  Hermoso sin igual eres T&uacute;  Se&ntilde;or.  &nbsp; <br />\n  Yo te // adorare //  siempre // <br />\n  En tu presencia quiero  estar Se&ntilde;or,<br />\n  junto a ti.//<br />\n</p>"}, {"num": 193, "title": "Exáltate", "html": "</p>\n<p>Al borde de tu gran trono<br />\n  Me postrare hoy  a ti. <br />\n  T&uacute;  reinas sobre principados <br />\n  Sentado  a la diestra de Dios. <br />\n  &nbsp; <br />\n  Coro <br />\n  &iexcl;Ex&aacute;ltate!  Oh gran cordero. <br />\n  Tu vives hoy y vivir&aacute;s;<br />\n  Cor&oacute;nate con mi alabanza&nbsp; <br />\n  Tu  nombre es: El Vencedor. <br />\n&nbsp; </p>"}, {"num": 194, "title": "Rey de reyes", "html": "</p>\n<p>//  Rey de reyes,<br />\n  Se&ntilde;or de se&ntilde;ores, <br />\n  Gloria,  &iexcl;Aleluya! // <br />\n  &nbsp; <br />\n  //  Cristo pr&iacute;ncipe de paz <br />\n  Gloria,  &iexcl;Aleluya! // <br />\n&nbsp; </p>"}, {"num": 195, "title": "Quiero estar donde tu estas", "html": "Solo quiero  estar donde tu estas, <br />\nMorando a diario en tu presencia,<br />\nNo  quiero adorar aqu&iacute; ya m&aacute;s,<br />\nLl&eacute;vame a donde estas. <br />\n  &nbsp; <br />\n  Solo quiero estar donde tu estas,<br />\n  En tu morada para siempre.<br />\n  Ll&eacute;vame al lugar donde tu estas,<br />\n  Quiero estar donde t&uacute; est&aacute;s. <br />\n  &nbsp; <br />\n  //Yo quiero estar contigo,<br />\n  Morando en tu  presencia. <br />\n  Sentado  a tu mesa,<br />\n  rodeado de tu gloria. <br />\n  Tu  presencia,<br />\n  es donde siempre quiero estar, <br />\n  Solo  quiero estar, <br />\n  Quiero estar donde tu  estas //<br />\n</p>"}, {"num": 196, "title": "Cerca de ti", "html": "Cerca  de ti yo quiero estar, <br />\n  Para  escuchar tu voz,<br />\n  y aprender de ti, <br />\n  Quiero  ser un reflejo<br />\n  de tu amor, <br />\n  Yo  quiero vivir,<br />\n  solo en tu voluntad; <br />\n  &nbsp; <br />\n  //Jes&uacute;s  eres mi buen pastor, <br />\n  T&uacute;  conoces mi camino, <br />\n  Jes&uacute;s  puedo confiar en ti,<br />\n  &iexcl;Oh mi Dios, me rindo hoy //<br />\n</p>"}, {"num": 197, "title": "Ven a cantar conmigo", "html": "Ven a cantar conmigo somos un pueblo  unido,<br />\nalza tu voz y canta para el Se&ntilde;or,<br />\n&iexcl;Para el Se&ntilde;or!<br />\nVen y dame tu mano,<br />\nhazme sentir hermano,<br />\nque todo es posible si hay amor,<br />\n&iexcl;Si hay uni&oacute;n! <br />\n&nbsp; <br />\nCoro <br />\nVen canta conmigo une tu voz<br />\nen alabanzas para el Creador,<br />\nque  llegue al cielo esta canci&oacute;n,<br />\nque da alegr&iacute;a a tu coraz&oacute;n.<br />\nVen a cantar, une tu  voz,<br />\ndame tu mano ven a cantar. <br />\n&nbsp; <br />\nVen y que este momento<br />\nno sea como el  viento,<br />\nque se quede grabado en tu coraz&oacute;n.<br />\n&iexcl;Ven a cantar! Ven y dame tu mano,<br />\nhazme sentir hermano,<br />\nque todo es posible si hay amor,<br />\n&iexcl;si hay uni&oacute;n!<br />\n</p>\n<p>  <br />"}, {"num": 198, "title": "Adoremos al Padre", "html": "Adoremos al Padre, solo al Padre,<br />\n  a nuestro Padre de gloria.<br />\n  Adoremos al Padre, solo al Padre,<br />\n  a nuestro Padre de amor. <br />\n  &nbsp; <br />\n  Coro:&nbsp; <br />\n  Y  juntos a una voz,<br />\n  cantaremos al Se&ntilde;or. // <br />\n  &nbsp; <br />\n  Alcen voces al Padre,\n  solo al Padre,<br />\n  a  nuestro Padre de gloria.<br />\n  Alcen voces al Padre, solo al Padre,<br />\n  a nuestro Padre  de amor.<br />\n</p>"}, {"num": 199, "title": "Estamos Juntos Otra Vez.", "html": "Estamos juntos otra vez alabando al Se&ntilde;or,<br />\n  estamos juntos otra vez en comuni&oacute;n<br />  \n  Algo nuevo va a suceder,<br />\n  que el Se&ntilde;or ya prepar&oacute;,<br />\n  estamos juntos otra  vez<br />\n  alabando al Se&ntilde;or, al Se&ntilde;or.<br />\n</p>"}, {"num": 200, "title": "Nos reuniremos en el monte", "html": "Nos reuniremos en el monte.<br />\n  Nos acercamos en su faz.<br />\n  Humildemente ante su trono,<br />\n  cantamos gloria a nuestro Dios.<br />\n  <br />\n  Coro:<br />\n  Gloria, honor y alabanza hacia<br />\n  el Cordero nuestro Rey.<br />\n  &iexcl;Oh Aleluya,  aleluya!<br />\n  Salvos por gracia y no por ley.<br />\n</p>"}, {"num": 201, "title": "Cristo, eres mi roca fuerte", "html": "</p>\n<p>Coro:<br />\n  Cristo eres mi roca fuerte,<br />\n  yo s&eacute; en ti seguro estoy<br />\n  &iexcl;Cristo  eres mi roca fuerte!<br />\n  //Conf&iacute;o siempre en tu santo amor // <br />\n  &nbsp; <br />\n  Tengo esperanza // tengo futuro //<br />\n  Tiene  algo para m&iacute; // seguro estoy //&nbsp; <br />\n  &nbsp; <br />\n  Fiel y muy fuerte // es tu palabra //<br />\n  T&uacute; me libertaras //  seguro estoy // <br />\n&nbsp; </p>"}, {"num": 202, "title": "Enamórame", "html": "</p>\n<p>Quiero entregarte mi sue&ntilde;os,<br />\n  tu voluntad has en ellos.<br />\n  Mi  coraz&oacute;n te lo entrego,<br />\n  enam&oacute;rame de ti, Se&ntilde;or. <br />\n  &nbsp; <br />\n  Quiero aprender a escucharte,<br />\n  quiero saber que es amarte.<br />\n  De  tu verdad yo saciarme,<br />\n  enam&oacute;rame de ti, Se&ntilde;or. <br />\n  &nbsp; <br />\n  Coro <br />\n  Que tu presencia me inunde,<br />\n  haz de mi un  odre nuevo.<br />\n  &iexcl;C&aacute;mbiame, renu&eacute;vame! <br />\n  Enam&oacute;rame,  de ti Se&ntilde;or. <br />\n&nbsp; </p>"}, {"num": 203, "title": "El volverá", "html": "</p>\n<p>Como el rel&aacute;mpago, que sale del oriente<br />\n  y va al occidente as&iacute;  ser&aacute; cuando venga el Se&ntilde;or.<br />\n  Como ladr&oacute;n que viene en la noche<br />\n  y nadie lo espera  as&iacute; ser&aacute; cuando vuelva Jes&uacute;s. <br />\n  &nbsp; <br />\n  Coro <br />\n  El volver&aacute; y a su gloria me transformar&aacute;,<br />\n  regresar&aacute; y una nube  me arrebatar&aacute;.&nbsp; <br />\nCon  poder y gran gloria Cristo Jes&uacute;s. &nbsp; </p>\n<p>Con voz de mando descender&aacute; del cielo<br />\n  y tocar&aacute; trompeta, as&iacute; ser&aacute;,  cuando venga el Se&ntilde;or.<br />\n  &Eacute;l llamar&aacute; a los que han dormido<br />\n  y los que hemos cre&iacute;do,  as&iacute; ser&aacute;,<br />\n  cuando vuelva Jes&uacute;s.<br />\n</p>"}, {"num": 204, "title": "Sentado en Su Trono", "html": "</p>\n<p>&nbsp;Sentado en su trono rodeado de luz,<br />\n  A la diestra del  padre gobierna Jes&uacute;s;<br />\n  Con ojos de fuego,  con rostro de sol,<br />\n  Cuando abre su boca  es trueno su voz. </p>\n<p>Coro: // Poderoso,  en Majestad y Reino, poderoso. Poderoso, en Potestad e Imperio, poderoso.//<br />\n    <br />\n  Un gran arco iris  corona su ser<br />\n  &Eacute;l es el cordero  que pudo vencer<br />\n  &Eacute;l es el primero,  &Eacute;l es el postrer<br />\n  Y arrojan coronas  delante de &Eacute;l.<br />\n</p>"}, {"num": 205, "title": "Sos el Único", "html": "</p>\n<p>Oh, Jes&uacute;s te alabo  (Oh, Jes&uacute;s te alabo)<br />\nY t&uacute; nombre ensalzo  (Y t&uacute; nombre ensalzo)<br />\nSos el Sant&iacute;simo  (Sos el Sant&iacute;simo)<br />\nMi Se&ntilde;or sos el  &uacute;nico (Sos el &uacute;nico)<br />\nCanten<br />\nAle, ale, aleluya  (Ale, ale, aleluya)<br />\nToda gloria es tuya  (Toda gloria es tuya)<br />\nSos el Sant&iacute;simo  (Sos el Sant&iacute;simo)<br />\nMi Se&ntilde;or sos el  &uacute;nico (Sos el &uacute;nico)<br />\n</p>"}, {"num": 206, "title": "Un palacio tengo", "html": "/// Un palacio  tengo all&aacute;,<br />\nm&aacute;s lindo que el Sol \n(En gloria)  ///<br />\nEn el m&aacute;s all&aacute;.</p>\n<p>/// Bendito Cristo<br />\n  contigo estar&eacute;, (en gloria) ///<br />\nEn el m&aacute;s all&aacute;.</p>\n<p>/// Una corona de  oro<br />\n  yo tendr&eacute;, (en gloria) ///<br />\nEn el m&aacute;s all&aacute;.</p>\n<p>/// Si tu quieres  ir al cielo<br />\n  ven a Jes&uacute;s, (ven pronto) ///<br />\nVen sin demorar.<br />\n</p>"}, {"num": 207, "title": "Te Alabare mi buen Jesús.", "html": "Eres t&uacute;  la &uacute;nica raz&oacute;n<br />\nde mi adoraci&oacute;n oh Jes&uacute;s<br />\nEres t&uacute;  la esperanza que anhele tener oh Jes&uacute;s</p>\n<p>Confi&eacute;  en ti, me has ayudado, <br />\n  Tu  salvaci&oacute;n me has regalado.<br />\n  Hoy hay  gozo en mi coraz&oacute;n, con mi canto te alabar&eacute;</p>\n<p>// Te  alabar&eacute;, te glorificar&eacute;, te alabar&eacute; mi buen Jes&uacute;s //</p>\n<p>En todo tiempo te alabare, en todo tiempo te adorar&eacute;</p>\n<p>// Te  alabar&eacute;, te glorificar&eacute;, te alabar&eacute; mi buen Jes&uacute;s //</p>\n<p>&nbsp;</p>"},
{"num": 208, "title": "Jehová está en medio de ti", "html": "</p>\n<p>Jehová está en medio de ti, poderoso.<br />\n Te salvará, se gozará sobre ti, con alegría.<br />\n  Callara de amor, se gozará sobre ti con cánticos.<br />\nJehová esta en medio de ti, poderoso.</p>\n<p>Poderosísimo oh oh, Poderosísimo oh oh,<br>Poderosísimo.<br /></p>"},
{"num": 209, "title": "Lléname Señor", "html": "</p>\n<p> Como el ciervo<br />\n  Busca por las aguas<br />\n  As&iacute; clama mi alma<br />\n  Por Ti, Se&ntilde;or</p>\n<p>D&iacute;a y noche<br />\n  Yo tengo sed de Ti<br />\n  Y solo a Ti, Buscar&eacute;</p>\n<p>Ll&eacute;name, \n  Ll&eacute;name, Se&ntilde;or<br />\n  Dame m&aacute;s, \n  M&aacute;s de Tu amor</p>\n<p>Yo tengo sed,\n  Solo de Ti<br />\nLl&eacute;name, Se&ntilde;or<br />\n</p>"}, {"num": 210, "title": "Llena mi copa", "html": "///Llena  mi copa de tu amor ///<br />\nQue  rebose de tu amor.<br />\n<br />\nDivina  gracia cuan dulce es<br />\nSin  merecer salvaci&oacute;n me dio<br />\nPerdido  fui, pero me encontr&oacute;<br />\nYo era  ciego y puedo ver.</p>"}];


const indexList = document.getElementById('index-list');
const searchInput = document.getElementById('search');
const countEl = document.getElementById('count');
const noResults = document.getElementById('no-results');
const songView = document.getElementById('song-view');
const songTitle = document.getElementById('song-title');
const songNum = document.getElementById('song-num');
const songLyrics = document.getElementById('song-lyrics');
const backBtn = document.getElementById('back-btn');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlight(text, query) {
  if (!query) return text;
  const re = new RegExp('(' + escapeRegExp(query) + ')', 'ig');
  return text.replace(re, '<mark>$1</mark>');
}

function renderIndex(filter) {
  const q = (filter || '').trim().toLowerCase();
  let filtered = SONGS;
  if (q) {
    filtered = SONGS.filter(s =>
      String(s.num) === q ||
      s.title.toLowerCase().includes(q) ||
      ('' + s.num).includes(q)
    );
  }
  indexList.innerHTML = '';
  if (filtered.length === 0) {
    noResults.style.display = 'block';
    indexList.style.display = 'none';
  } else {
    noResults.style.display = 'none';
    indexList.style.display = 'block';
    const frag = document.createDocumentFragment();
    filtered.forEach(s => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.dataset.num = s.num;
      const numSpan = document.createElement('span');
      numSpan.className = 'num';
      numSpan.textContent = s.num + '.';
      const titleSpan = document.createElement('span');
      titleSpan.innerHTML = highlight(s.title, q);
      btn.appendChild(numSpan);
      btn.appendChild(titleSpan);
      btn.addEventListener('click', () => showSong(s.num));
      li.appendChild(btn);
      frag.appendChild(li);
    });
    indexList.appendChild(frag);
  }
  countEl.textContent = filtered.length + (filtered.length === 1 ? ' canto encontrado' : ' cantos') + (q ? ' para "' + filter + '"' : ' en total');
}

function showSong(num) {
  const song = SONGS.find(s => s.num === num);
  if (!song) return;
  songNum.textContent = 'Canto N.o ' + song.num;
  songTitle.textContent = song.title;
  songLyrics.innerHTML = song.html;
  songView.style.display = 'block';
  document.querySelector('.search-wrap').style.display = 'none';
  indexList.style.display = 'none';
  noResults.style.display = 'none';
  countEl.style.display = 'none';
  window.scrollTo({top: 0, behavior: 'smooth'});

  const idx = SONGS.findIndex(s => s.num === num);
  prevBtn.disabled = idx <= 0;
  nextBtn.disabled = idx >= SONGS.length - 1;
  prevBtn.onclick = () => { if (idx > 0) showSong(SONGS[idx-1].num); };
  nextBtn.onclick = () => { if (idx < SONGS.length - 1) showSong(SONGS[idx+1].num); };

  history.replaceState(null, '', '#c' + song.num);
}

function showIndex() {
  songView.style.display = 'none';
  document.querySelector('.search-wrap').style.display = 'block';
  countEl.style.display = 'block';
  renderIndex(searchInput.value);
  history.replaceState(null, '', '#');
}

backBtn.addEventListener('click', showIndex);
searchInput.addEventListener('input', () => renderIndex(searchInput.value));

// Deep link support: #c5 opens song 5 directly
function handleHash() {
  const hash = location.hash;
  const m = hash.match(/^#c?(\d+)$/);
  if (m) {
    showSong(parseInt(m[1], 10));
  } else {
    showIndex();
  }
}
window.addEventListener('hashchange', handleHash);
handleHash();

// ---- Control de tamaño de fuente ----
(function() {
  const step = 10; // %
  const min = 70;
  const max = 160;
  let current = 100;

  const decBtn = document.getElementById('font-dec');
  const incBtn = document.getElementById('font-inc');
  const label = document.getElementById('font-label');

  function applyFontSize() {
    document.documentElement.style.fontSize = current + '%';
    label.textContent = current + '%';
  }

  decBtn.addEventListener('click', () => {
    current = Math.max(min, current - step);
    applyFontSize();
  });

  incBtn.addEventListener('click', () => {
    current = Math.min(max, current + step);
    applyFontSize();
  });
})();

  // Lógica para la ventana flotante "Acerca de"
  document.addEventListener('DOMContentLoaded', () => {
    const infoBtn = document.getElementById('menu-info-btn');
    const overlay = document.getElementById('about-overlay');
    const closeBtn = document.getElementById('about-close');

    if (infoBtn && overlay) {
      // Abrir modal
      infoBtn.addEventListener('click', (e) => {
        e.preventDefault();
        overlay.classList.add('open');
      });

      // Cerrar modal con (X)
      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          overlay.classList.remove('open');
        });
      }

      // Cerrar modal haciendo clic fuera de la tarjeta
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
          overlay.classList.remove('open');
        }
      });
    }
  });
